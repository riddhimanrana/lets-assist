<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Let's Assist maintenance</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7faf8;
        color: #17221b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: #ffffff;
        border: 1px solid #dce5df;
        border-radius: 18px;
        box-shadow: 0 18px 60px rgba(20, 55, 34, 0.08);
        max-width: 520px;
        padding: 34px;
        width: 100%;
      }

      p {
        color: #526158;
        font-size: 16px;
        line-height: 1.6;
        margin: 10px 0 0;
      }

      h1 {
        font-size: clamp(26px, 5vw, 34px);
        letter-spacing: -0.035em;
        line-height: 1.1;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>We'll be back shortly.</h1>
      <p>
        Let's Assist is temporarily unavailable while a database update
        finishes. Try again in a few minutes.
      </p>
    </main>
  </body>
</html>
