name: CSF Scheduled Post Publisher

# Publishes due CSF posts through the permission-rechecked, bounded database
# transition. GitHub evaluates scheduled workflows only from the default branch.
# The cron expression requests a run every ten minutes, offset from the top of
# the hour, but GitHub Actions schedules can be delayed or dropped under load
# and therefore provide no fixed publication-time SLA.

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository_owner == 'riddhimanrana'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    concurrency:
      group: cron-csf-scheduled-post-publisher
      cancel-in-progress: false
    env:
      CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
      CRON_TOKEN: ${{ secrets.CRON_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET || secrets.VERCEL_BYPASS_SECRET }}
      BETTERSTACK_HEARTBEAT_URL: ${{ secrets['BETTERSTACK_CSF_SCHEDULED_POSTS_HEARTBEAT_URL'] || secrets['BETTERSTACK_HEARTBEAT_URL'] }}
      ENDPOINT_PATH: /api/cron/csf-scheduled-post-publisher
      HTTP_METHOD: POST
    steps:
      - name: Validate configuration
        run: |
          test -n "$CRON_BASE_URL" || { echo "CRON_BASE_URL secret missing"; exit 1; }
          test -n "$CRON_TOKEN" || { echo "CRON_SECRET secret missing"; exit 1; }

      - name: Publish due posts
        run: |
          set -euo pipefail

          endpoint="${CRON_BASE_URL%/}${ENDPOINT_PATH}"
          max_attempts=5
          vercel_bypass_args=()
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            vercel_bypass_args=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Attempt ${attempt}/${max_attempts}: ${HTTP_METHOD} ${endpoint}"
            headers_file="$(mktemp)"
            body_file="$(mktemp)"

            status_code="$({
              curl -sS -X "$HTTP_METHOD" \
                -H "Authorization: Bearer $CRON_TOKEN" \
                -H "Accept: application/json" \
                -H "User-Agent: lets-assist-cron/${GITHUB_WORKFLOW}" \
                "${vercel_bypass_args[@]}" \
                -D "$headers_file" \
                -o "$body_file" \
                -w "%{http_code}" \
                --connect-timeout 10 \
                --max-time 120 \
                "$endpoint" || true
            })"

            echo "HTTP status: ${status_code}"
            if [[ "$status_code" =~ ^2[0-9][0-9]$ ]]; then
              enabled="$(jq -r '.enabled // false' "$body_file" 2>/dev/null || echo false)"
              if [[ "$enabled" != "true" ]]; then
                echo "Scheduled-post publisher is not enabled in the target environment."
                rm -f "$headers_file" "$body_file"
                exit 1
              fi

              examined="$(jq -r '.examined // 0' "$body_file")"
              published="$(jq -r '.published // 0' "$body_file")"
              held="$(jq -r '.held // 0' "$body_file")"
              echo "Publisher outcome: examined=${examined} published=${published} held=${held}"
              rm -f "$headers_file" "$body_file"
              exit 0
            fi

            if [[ -s "$body_file" ]]; then
              if grep -qi "Vercel Security Checkpoint" "$body_file"; then
                echo "Response body: Vercel Security Checkpoint (deployment protection challenge)."
              else
                echo "Response body:"
                head -c 4000 "$body_file"
                echo
              fi
            fi

            retry_after="$(awk 'BEGIN{IGNORECASE=1} /^retry-after:[[:space:]]*/ {gsub("\r", "", $2); print $2}' "$headers_file" | tail -n 1)"
            rm -f "$headers_file" "$body_file"

            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "Scheduled-post endpoint failed after ${max_attempts} attempts."
              exit 1
            fi

            if [[ "$status_code" == "429" ]]; then
              sleep_seconds="${retry_after:-$((attempt * 20))}"
              echo "Rate limited (429). Sleeping ${sleep_seconds}s before retry..."
              sleep "$sleep_seconds"
              continue
            fi

            if [[ "$status_code" =~ ^5[0-9][0-9]$ || "$status_code" == "000" ]]; then
              sleep_seconds=$((attempt * 10))
              echo "Transient server/network error (${status_code}). Sleeping ${sleep_seconds}s..."
              sleep "$sleep_seconds"
              continue
            fi

            echo "Non-retryable response (${status_code}). Failing."
            exit 1
          done

      - name: Notify Better Stack heartbeat
        if: always()
        run: |
          set -euo pipefail
          [[ -z "${BETTERSTACK_HEARTBEAT_URL:-}" ]] && { echo "No BetterStack URL configured, skipping."; exit 0; }
          if [[ "${{ job.status }}" == "success" ]]; then
            curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$BETTERSTACK_HEARTBEAT_URL"
          else
            fail_url="${BETTERSTACK_HEARTBEAT_URL%/}/fail"
            curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$fail_url" || true
          fi
