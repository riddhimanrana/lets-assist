name: Bootstrap Production request fence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only CLI diagnosis or separately authorized guard installation"
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - install
      accepted_main_sha:
        description: "Exact current main SHA containing the reviewed bootstrap and accepted 687/688 catalogs"
        required: true
        type: string
      production_confirmation:
        description: "diagnose-production:fotdmeakexgrkronxlof:<exact main SHA> (install uses bootstrap-production)"
        required: true
        type: string
      external_writers_confirmation:
        description: "external-writers-stopped:<exact main SHA>, including Auth, Storage and external schedulers"
        required: false
        type: string

concurrency:
  group: production-schema-deployment
  queue: max
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  bootstrap:
    name: Review Production request-fence operation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Require database client
        if: inputs.mode == 'install'
        run: command -v psql >/dev/null
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        if: inputs.mode == 'diagnose'
        with:
          version: 2.120.0
      - name: Verify approval and diagnose CLI transport without applying migrations
        if: inputs.mode == 'diagnose'
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_MAIN_SHA: ${{ inputs.accepted_main_sha }}
          PRODUCTION_BOOTSTRAP_CONFIRMATION: ${{ inputs.production_confirmation }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/production/diagnose-request-fence-cli.mjs
      - name: Verify approval and install the additive guard
        if: inputs.mode == 'install'
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_MAIN_SHA: ${{ inputs.accepted_main_sha }}
          PRODUCTION_BOOTSTRAP_CONFIRMATION: ${{ inputs.production_confirmation }}
          EXTERNAL_WRITERS_CONFIRMATION: ${{ inputs.external_writers_confirmation }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          PRODUCTION_BOOTSTRAP_DATABASE_URL: ${{ secrets.PRODUCTION_BOOTSTRAP_DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/production/bootstrap-request-write-fence.mjs
      - name: Preserve sanitized bootstrap receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-request-fence-bootstrap-${{ github.run_id }}
          path: .artifacts/production-request-fence-bootstrap/receipt.json
          if-no-files-found: ignore
          retention-days: 30
