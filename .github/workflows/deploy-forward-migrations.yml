name: Apply accepted forward migrations

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full main-reachable accepted application SHA"
        required: true
        type: string
      hosted_development_sha:
        description: "Full hosted-accepted Development SHA with identical tree (normal path)"
        required: false
        type: string
      production_app_sha:
        description: "Schema-only path: full SHA of the unchanged app currently served on lets-assist.com"
        required: false
        type: string
      schema_only_confirmation:
        description: "Schema-only path: schema-only:<Production app SHA>:<release SHA>"
        required: false
        type: string
      performance_waiver_confirmation:
        description: "Optional: waive-csf-performance:<release SHA>:<Development SHA>"
        required: false
        type: string
      performance_waiver_reason:
        description: "Required with waiver: explain why hosted performance acceptance is waived (20-1000 characters)"
        required: false
        type: string
      local_validation_confirmation:
        description: "Optional: deploy-with-local-validation:<release SHA>:<Development SHA>"
        required: false
        type: string
      local_validation_reason:
        description: "Required with local override: describe local evidence and acceptance of skipped hosted/remote CI checks (20-1000 characters)"
        required: false
        type: string
      production_confirmation:
        description: "Type apply-forward-migrations:<release SHA>"
        required: true
        type: string

concurrency:
  group: production-schema-deployment
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      ACCEPTED_SHA: ${{ inputs.hosted_development_sha }}
      PRODUCTION_APP_SHA: ${{ inputs.production_app_sha }}
      SCHEMA_ONLY_CONFIRMATION: ${{ inputs.schema_only_confirmation }}
      PERFORMANCE_WAIVER_CONFIRMATION: ${{ inputs.performance_waiver_confirmation }}
      PERFORMANCE_WAIVER_REASON: ${{ inputs.performance_waiver_reason }}
      LOCAL_VALIDATION_CONFIRMATION: ${{ inputs.local_validation_confirmation }}
      LOCAL_VALIDATION_REASON: ${{ inputs.local_validation_reason }}
    steps:
      - name: Checkout reviewed controller
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Validate exact authorization
        env:
          CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_RUN_ATTEMPT}" == "1" ]]
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CONFIRMATION}" == "apply-forward-migrations:${RELEASE_SHA}" ]]
          if [[ -z "${PRODUCTION_APP_SHA}" ]]; then
            [[ "${ACCEPTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ -z "${SCHEMA_ONLY_CONFIRMATION}" ]]
          else
            [[ -z "${ACCEPTED_SHA}" ]]
            [[ "${PRODUCTION_APP_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${SCHEMA_ONLY_CONFIRMATION}" == "schema-only:${PRODUCTION_APP_SHA}:${RELEASE_SHA}" ]]
            [[ "${RELEASE_SHA}" == "${GITHUB_SHA}" ]]
            [[ -z "${PERFORMANCE_WAIVER_CONFIRMATION}${PERFORMANCE_WAIVER_REASON}${LOCAL_VALIDATION_CONFIRMATION}${LOCAL_VALIDATION_REASON}" ]]
          fi
      - name: Checkout accepted source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ inputs.release_sha }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: release/.node-version
      - name: Verify accepted source and CI
        if: inputs.production_app_sha == ''
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          node ../scripts/production/app-release-checks.mjs source | tee .artifacts/source-verification.json
      - name: Verify schema-only source, full CI and live Production app
        if: inputs.production_app_sha != ''
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_ROOT_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]]
          git merge-base --is-ancestor "${PRODUCTION_APP_SHA}" "${RELEASE_SHA}"
          mkdir -p .artifacts
          git diff --name-only --no-renames --no-ext-diff --no-textconv -z "${PRODUCTION_APP_SHA}" "${RELEASE_SHA}" -- > .artifacts/schema-only-changed-paths
          printf '%s\0' \
            '.github/workflows/deploy-forward-migrations.yml' \
            'docs/README.md' \
            'docs/development/production-points-schema-hotfix.md' \
            'scripts/production/app-release-catalog.mjs' \
            'scripts/production/app-release-checks.mjs' \
            'scripts/production/csf-repeatable-pending-claims-catalog.test.mjs' \
            'scripts/production/final-schema-688.json' \
            'scripts/production/final-schema-manifest.md' \
            'scripts/production/forward-migration-allowlist.mjs' \
            'scripts/production/forward-migration-historical-tails.test.mjs' \
            'scripts/production/forward-migration-release-fixture.mjs' \
            'scripts/production/migration-digests.mjs' \
            'scripts/production/production-schema-only-source.mjs' \
            'scripts/production/production-schema-only-source.test.mjs' \
            'supabase/migrations/20261013071100_csf_repeatable_pending_activity_claims.sql' \
            'supabase/tests/database/csf_fixed_activity_submission_uniqueness.test.sql' > .artifacts/schema-only-reviewed-paths
          cmp -s .artifacts/schema-only-changed-paths .artifacts/schema-only-reviewed-paths
          SCHEMA_ONLY_VERIFIER_BLOB=fc1db5eea780b9e793c7e60ad7aee7aa0199b26e
          [[ "$(git hash-object ../scripts/production/production-schema-only-source.mjs)" == "${SCHEMA_ONLY_VERIFIER_BLOB}" ]]
          [[ "$(sha256sum ../scripts/production/app-release-checks.mjs | cut -d ' ' -f1)" == "64790cb3c0879d0d979ef8bbbac13c4353f293ae6a72e3de90c5bc618acbea65" ]]
          [[ "$(sha256sum ../scripts/production/app-release-catalog.mjs | cut -d ' ' -f1)" == "4dd8f5d74f062f36cd354b6c51e7c1de7b5b34aca76666be8b6afc529d361e59" ]]
          node ../scripts/production/production-schema-only-source.mjs | tee .artifacts/source-verification.json
      - name: Retain source verification and any explicit waiver
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-verification-${{ github.run_id }}
          path: release/.artifacts/source-verification.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify Production project binding for schema-only release
        if: inputs.production_app_sha != ''
        working-directory: release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_ROOT_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          EXPECTED_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: bash ../scripts/production/verify-vercel-project.sh
      - name: Recheck unchanged Production app before schema-only write
        if: inputs.production_app_sha != ''
        working-directory: release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_ROOT_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: node ../scripts/production/production-schema-only-source.mjs live
      - name: Apply the approved migration bytes once
        working-directory: release
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          node ../scripts/production/forward-migration-release.mjs > .artifacts/forward-migrations.json
      - name: Recheck unchanged Production app after schema-only release
        if: inputs.production_app_sha != ''
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_ROOT_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: node ../scripts/production/production-schema-only-source.mjs live
      - name: Retain count-only outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forward-migrations-${{ github.run_id }}
          path: release/.artifacts/forward-migrations.json
          if-no-files-found: ignore
          retention-days: 30
