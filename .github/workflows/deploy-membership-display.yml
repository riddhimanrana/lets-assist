name: Deploy verified membership display fix

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact current Main SHA containing only the reviewed display fix and acceptance tooling
        required: true
        type: string
      fixture_confirmation:
        description: "test-existing-development-fixture:<SHA>; permits 35 synthetic preference saves, possible restoration and 100 Auth sign-ins in Development only"
        required: true
        type: string
      production_confirmation:
        description: "deploy-membership-display:<SHA>"
        required: true
        type: string

concurrency:
  group: production-schema-deployment
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

env:
  RELEASE_SHA: ${{ inputs.release_sha }}
  CONFIRMATION: ${{ inputs.production_confirmation }}
  FIXTURE_CONFIRMATION: ${{ inputs.fixture_confirmation }}

jobs:
  hosted-acceptance:
    name: Hosted membership-display acceptance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 75
    concurrency:
      group: csf-hosted-development-acceptance
      cancel-in-progress: false
    env:
      DEVELOPMENT_PROJECT_REF: ocbuygudvarsuxijxhau
      VERCEL_ROOT_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
    steps:
      - name: Validate trusted Main dispatch before checkout
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTIONS}" == true && "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]
          [[ "${GITHUB_REF}" == refs/heads/main && "${GITHUB_RUN_ATTEMPT}" == 1 ]]
          [[ "${GITHUB_REPOSITORY}" == riddhimanrana/lets-assist && "${GITHUB_REPOSITORY_ID}" == 713042374 ]]
          [[ "${GITHUB_WORKFLOW_REF}" == riddhimanrana/lets-assist/.github/workflows/deploy-membership-display.yml@refs/heads/main ]]
          [[ "${RELEASE_SHA}" =~ ^[a-f0-9]{40}$ && "${RELEASE_SHA}" == "${GITHUB_SHA}" ]]
          [[ "${CONFIRMATION}" == "deploy-membership-display:${GITHUB_SHA}" ]]
          [[ "${FIXTURE_CONFIRMATION}" == "test-existing-development-fixture:${GITHUB_SHA}" ]]
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve fixed private gitlink
        id: private
        run: |
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "$(git rev-parse HEAD:lib/plugins/private)" == 7ded413a51b1ef6cd66f6a754c7233394d094ebd ]]
          git submodule init
          echo "sha=$(git rev-parse HEAD:lib/plugins/private)" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: riddhimanrana/lets-assist-plugins
          ref: ${{ steps.private.outputs.sha }}
          path: lib/plugins/private
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_SUBMODULE_SSH_KEY }}
          persist-credentials: false
      - name: Normalize private repository metadata
        run: |
          git -C lib/plugins/private remote set-url origin https://github.com/riddhimanrana/lets-assist-plugins.git
          git submodule absorbgitdirs lib/plugins/private
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify exact source and full CI before provider work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --recurse-submodules=no origin main development
          node scripts/production/membership-display-source.mjs acceptance
      - name: Install accepted dependencies and private contracts
        run: |
          bun install --frozen-lockfile
          bun run plugin:submodules:check:strict
      - name: Create one exact isolated Preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEVELOPMENT_DATABASE_URL: ${{ secrets.DEVELOPMENT_DATABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/hosted-development/membership-display-preview.mjs create
      - name: Preserve immutable Preview receipt including uncertain outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: membership-display-preview-${{ github.run_id }}
          path: .artifacts/membership-display-preview.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify exact hosted Preview before acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEVELOPMENT_DATABASE_URL: ${{ secrets.DEVELOPMENT_DATABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/hosted-development/membership-display-preview.mjs check
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run full hosted CSF acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CSF_HOSTED_ACCEPTANCE_MODE: full
          CSF_MEMBERSHIP_PREVIEW_RECEIPT: .artifacts/membership-display-preview.json
          CSF_APP_URL: ${{ steps.preview.outputs.origin }}
          CSF_HOSTED_LOAD_CONFIRMATION: load-hosted-development:ocbuygudvarsuxijxhau
          CSF_HOSTED_LOAD_PASSWORD: ${{ secrets.CSF_HOSTED_LOAD_PASSWORD }}
          EXPECTED_NON_PRODUCTION_SUPABASE_PROJECT_REF: ocbuygudvarsuxijxhau
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CSF_DEVELOPMENT_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: https://ocbuygudvarsuxijxhau.supabase.co
        run: bun run csf:test:hosted:load
      - name: Verify exact hosted Preview after acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEVELOPMENT_DATABASE_URL: ${{ secrets.DEVELOPMENT_DATABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/hosted-development/membership-display-preview.mjs check
      - name: Recheck source and Development baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --recurse-submodules=no origin main development
          node scripts/production/membership-display-source.mjs acceptance

  deploy:
    name: Deploy hosted-verified membership display fix
    needs: hosted-acceptance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    defaults:
      run:
        working-directory: release
        shell: bash
    env:
      ACCEPTED_SHA: ${{ inputs.release_sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
      VERCEL_ROOT_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      EXPECTED_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
    steps:
      - name: Validate trusted Main dispatch before checkout
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTIONS}" == true && "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]
          [[ "${GITHUB_REF}" == refs/heads/main && "${GITHUB_RUN_ATTEMPT}" == 1 ]]
          [[ "${GITHUB_REPOSITORY}" == riddhimanrana/lets-assist && "${GITHUB_REPOSITORY_ID}" == 713042374 ]]
          [[ "${GITHUB_WORKFLOW_REF}" == riddhimanrana/lets-assist/.github/workflows/deploy-membership-display.yml@refs/heads/main ]]
          [[ "${RELEASE_SHA}" =~ ^[a-f0-9]{40}$ && "${RELEASE_SHA}" == "${GITHUB_SHA}" ]]
          [[ "${CONFIRMATION}" == "deploy-membership-display:${GITHUB_SHA}" ]]
          [[ "${FIXTURE_CONFIRMATION}" == "test-existing-development-fixture:${GITHUB_SHA}" ]]
      - name: Checkout reviewed release controller
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout the accepted application
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ github.sha }}
          path: release
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve accepted private gitlink
        id: private
        run: |
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "$(git rev-parse HEAD:lib/plugins/private)" == 7ded413a51b1ef6cd66f6a754c7233394d094ebd ]]
          git submodule init
          echo "sha=$(git rev-parse HEAD:lib/plugins/private)" >> "${GITHUB_OUTPUT}"

      - name: Checkout accepted private plugin
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: riddhimanrana/lets-assist-plugins
          ref: ${{ steps.private.outputs.sha }}
          path: release/lib/plugins/private
          fetch-depth: 0
          ssh-key: ${{ secrets.PRIVATE_SUBMODULE_SSH_KEY }}
          persist-credentials: false

      - name: Normalize private repository metadata
        run: |
          git -C lib/plugins/private remote set-url origin https://github.com/riddhimanrana/lets-assist-plugins.git
          git submodule absorbgitdirs lib/plugins/private

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: release/.node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Verify full hosted acceptance and exact Main CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production/membership-display-source.mjs deploy
      - name: Retain exact source and hosted verification
        if: steps.source.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-verification-${{ github.run_id }}
          path: release/.artifacts/source-verification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Download immutable Preview receipt from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: membership-display-preview-${{ github.run_id }}
          path: release/.artifacts

      - name: Verify pinned Production baseline after review
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/hosted-development/membership-display-preview.mjs baseline

      - name: Verify Production schema without writing
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node ../scripts/production/app-release-checks.mjs schema

      - name: Verify Production project binding
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash ../scripts/production/verify-vercel-project.sh

      - name: Install accepted dependencies and verify private gitlink
        run: |
          bun install --frozen-lockfile
          bun run plugin:submodules:init
          bun run plugin:submodules:check:strict

      - name: Recheck pinned Production baseline before staging
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/hosted-development/membership-display-preview.mjs baseline

      - name: Create one Vercel-side Production build without domains
        id: staged
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node ../scripts/production/app-release-stage.mjs create

      - name: Retain staged build identity before waiting
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-only-stage-${{ github.run_id }}
          path: release/.artifacts/app-only-stage.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Wait for the existing staged build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_DEPLOYMENT_ID: ${{ steps.staged.outputs.deployment_id }}
        run: node ../scripts/production/app-release-stage.mjs wait

      - name: Check staged application
        env:
          DEPLOYMENT_ORIGIN: ${{ steps.staged.outputs.origin }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node ../scripts/production/app-release-smoke.mjs

      - name: Record alias recovery targets
        env:
          PREVIOUS: ${{ steps.previous.outputs.deployment_id }}
          STAGED: ${{ steps.staged.outputs.deployment_id }}
        run: |
          mkdir -p .artifacts
          jq -n --arg previous "${PREVIOUS}" --arg staged "${STAGED}" \
            --arg release "${RELEASE_SHA}" --arg accepted "${ACCEPTED_SHA}" \
            --arg controller "${GITHUB_SHA}" \
            '{previous:$previous, staged:$staged, release:$release, accepted:$accepted, controller:$controller}' \
            > .artifacts/app-only-release.json

      - name: Retain count-only recovery receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-only-release-${{ github.run_id }}
          path: release/.artifacts/app-only-release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Recheck source and hosted proof before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production/membership-display-source.mjs deploy

      - name: Verify alias unchanged before promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
        run: bash ../scripts/production/verify-vercel-alias.sh

      - name: Recheck pinned Production baseline before promotion
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/hosted-development/membership-display-preview.mjs baseline

      - name: Promote staged application
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ORIGIN: ${{ steps.staged.outputs.origin }}
        run: |
          set -euo pipefail
          bunx vercel@59.3.0 promote "${DEPLOYMENT_ORIGIN}" --yes --token="${VERCEL_TOKEN}"

      - name: Verify exact public alias and application
        id: public
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PRODUCTION_DEPLOYMENT_ID: ${{ steps.staged.outputs.deployment_id }}
          EXPECTED_ALIAS_OPERATION: promote
          EXPECTED_ALIAS_OPERATION_DEPLOYMENT_ID: ${{ steps.staged.outputs.deployment_id }}
          DEPLOYMENT_ORIGIN: https://lets-assist.com
        run: |
          set -euo pipefail
          bash ../scripts/production/verify-vercel-alias-operation.sh
          bash ../scripts/production/verify-vercel-alias.sh
          node ../scripts/production/app-release-smoke.mjs

      - name: Restore prior app if promotion does not settle
        if: ${{ always() && steps.promote.outcome != 'skipped' && steps.promote.outcome != '' && steps.public.outcome != 'success' }}
        timeout-minutes: 6
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIOUS: ${{ steps.previous.outputs.deployment_id }}
          STAGED: ${{ steps.staged.outputs.deployment_id }}
          PRODUCTION_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
        run: |
          set -euo pipefail
          EXPECTED_ALIAS_OPERATION=promote EXPECTED_ALIAS_OPERATION_DEPLOYMENT_ID="${STAGED}" \
            bash ../scripts/production/verify-vercel-alias-operation.sh
          payload="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --get \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" --data-urlencode 'domain=lets-assist.com' \
            --data-urlencode "projectId=${VERCEL_ROOT_PROJECT_ID}" \
            --data-urlencode "teamId=${VERCEL_TEAM_ID}" https://api.vercel.com/v4/aliases)"
          current="$(jq -er --arg project "${VERCEL_ROOT_PROJECT_ID}" \
            '[.aliases[] | select(.alias == "lets-assist.com" and .projectId == $project)]
             | if length == 1 then .[0].deploymentId else error("ambiguous alias") end' <<<"${payload}")"
          if [[ "${current}" == "${PREVIOUS}" ]]; then
            bash ../scripts/production/verify-vercel-alias.sh
            exit 0
          fi
          [[ "${current}" == "${STAGED}" ]] || {
            echo 'Production alias moved outside this release. Manual reconciliation required.' >&2
            exit 1
          }
          bunx vercel@59.3.0 promote "${PREVIOUS}" --yes --token="${VERCEL_TOKEN}" || true
          EXPECTED_ALIAS_OPERATION=promote EXPECTED_ALIAS_OPERATION_DEPLOYMENT_ID="${PREVIOUS}" \
            bash ../scripts/production/verify-vercel-alias-operation.sh
          bash ../scripts/production/verify-vercel-alias.sh

      - name: Record public release result
        if: steps.public.outcome == 'success'
        run: |
          printf 'Published accepted application `%s`. No Production database or import changes; hosted acceptance used only Development synthetic preference/Auth operations.\n' \
            "${RELEASE_SHA}" >> "${GITHUB_STEP_SUMMARY}"
