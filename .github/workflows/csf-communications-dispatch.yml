name: CSF Communications Dispatch

# Drains the durable CSF communications ledger. Queued campaign mail is sent
# ONLY by this worker; without a scheduler, finalized campaigns would sit
# queued forever. Vercel Cron owns the Production schedule. This workflow is a
# manual, approval-gated fallback for operator recovery. The drain loop below
# finishes a full ~500-recipient campaign inside one run instead of one 50-send
# batch per tick.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Worker environment
        required: true
        default: production
        type: choice
        options:
          - production
          - development
      development_sha:
        description: Exact deployed Development SHA, required for Development
        required: false
        type: string
      worker:
        description: Development worker to check
        required: true
        default: communications
        type: choice
        options:
          - communications
          - workbook
      mode:
        description: Development check mode
        required: true
        default: verify-disabled
        type: choice
        options:
          - verify-disabled
          - dispatch-test
          - prepare-test
      confirmation:
        description: "For Development, type <mode>:ocbuygudvarsuxijxhau"
        required: false
        type: string
      campaign_id:
        description: Audited ten-recipient test campaign receipt
        required: false
        type: string
      workbook_id:
        description: Linked fictional Development workbook receipt
        required: false
        type: string
      workbook_job_id:
        description: Untouched fictional Development refresh job receipt
        required: false
        type: string

permissions:
  contents: read

jobs:
  development-check:
    if: github.ref == 'refs/heads/development' && inputs.target == 'development' && inputs.worker != 'workbook'
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 5
    concurrency:
      group: csf-development-delivery-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Verify or dispatch the Development test queue once
        env:
          ACCEPTED_SHA: ${{ inputs.development_sha }}
          CSF_DELIVERY_CHECK_MODE: ${{ inputs.mode }}
          CSF_DELIVERY_CONFIRMATION: ${{ inputs.confirmation }}
          CSF_TEST_CAMPAIGN_ID: ${{ inputs.campaign_id }}
          SUPABASE_URL: https://ocbuygudvarsuxijxhau.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CSF_COMMUNICATIONS_WORKER_SECRET_TOKEN: ${{ secrets.CSF_COMMUNICATIONS_WORKER_SECRET_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bun scripts/hosted-development/check-csf-delivery-worker.mjs

  development-workbook-check:
    if: github.ref == 'refs/heads/development' && inputs.target == 'development' && inputs.worker == 'workbook'
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 12
    concurrency:
      group: csf-development-workbook-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Check the fictional Development workbook job once
        env:
          ACCEPTED_SHA: ${{ inputs.development_sha }}
          CSF_WORKBOOK_CHECK_MODE: ${{ inputs.mode }}
          CSF_WORKBOOK_CONFIRMATION: ${{ inputs.confirmation }}
          CSF_TEST_WORKBOOK_ID: ${{ inputs.workbook_id }}
          CSF_TEST_WORKBOOK_JOB_ID: ${{ inputs.workbook_job_id }}
          SUPABASE_URL: https://ocbuygudvarsuxijxhau.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CSF_WORKBOOK_WORKER_SECRET_TOKEN: ${{ secrets.CSF_WORKBOOK_WORKER_SECRET_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bun scripts/hosted-development/check-csf-workbook-worker.mjs

  dispatch:
    if: github.repository_owner == 'riddhimanrana' && github.ref == 'refs/heads/main' && inputs.target != 'development' && inputs.worker != 'workbook'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency:
      group: cron-csf-communications-dispatch
      cancel-in-progress: false
    env:
      CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
      CRON_TOKEN: ${{ secrets.CRON_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET || secrets.VERCEL_BYPASS_SECRET }}
      BETTERSTACK_HEARTBEAT_URL: ${{ secrets['BETTERSTACK_CSF_DISPATCH_HEARTBEAT_URL'] || secrets['BETTERSTACK_HEARTBEAT_URL'] }}
      ENDPOINT_PATH: /api/cron/csf-communications-dispatch
      HTTP_METHOD: POST
    steps:
      - name: Validate configuration
        run: |
          test -n "$CRON_BASE_URL" || { echo "CRON_BASE_URL secret missing"; exit 1; }
          test -n "$CRON_TOKEN" || { echo "CRON_SECRET secret missing"; exit 1; }

      - name: Drain the dispatch ledger
        run: |
          set -euo pipefail

          endpoint="${CRON_BASE_URL%/}${ENDPOINT_PATH}"
          max_attempts=5
          # A full drain is bounded: 12 iterations x batch cap 50 = 600 sends,
          # comfortably above one all-cohorts campaign. The loop stops as soon
          # as a pass claims nothing.
          max_drain_iterations=12
          vercel_bypass_args=()
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            vercel_bypass_args=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi

          request_endpoint="$endpoint"
          if [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            encoded_bypass="${VERCEL_AUTOMATION_BYPASS_SECRET}"
            separator="?"
            if [[ "$endpoint" == *\?* ]]; then
              separator="&"
            fi
            request_endpoint="${endpoint}${separator}x-vercel-protection-bypass=${encoded_bypass}"
          fi

          call_endpoint() {
            local headers_file body_file status_code
            for attempt in $(seq 1 "$max_attempts"); do
              echo "Attempt ${attempt}/${max_attempts}: ${HTTP_METHOD} ${endpoint}"

              headers_file="$(mktemp)"
              body_file="$(mktemp)"

              status_code="$({
                curl -sS -X "$HTTP_METHOD" \
                  -H "Authorization: Bearer $CRON_TOKEN" \
                  -H "Accept: application/json" \
                  -H "User-Agent: lets-assist-cron/${GITHUB_WORKFLOW}" \
                  "${vercel_bypass_args[@]}" \
                  -D "$headers_file" \
                  -o "$body_file" \
                  -w "%{http_code}" \
                  --connect-timeout 10 \
                  --max-time 180 \
                  "$request_endpoint" || true
              })"

              echo "HTTP status: ${status_code}"
              if [[ -s "$body_file" ]]; then
                if grep -qi "Vercel Security Checkpoint" "$body_file"; then
                  echo "Response body: Vercel Security Checkpoint (deployment protection challenge)."
                else
                  echo "Response body:"
                  head -c 4000 "$body_file"
                  echo
                fi
              fi

              if [[ "$status_code" =~ ^2[0-9][0-9]$ ]]; then
                claimed="$(jq -r '.claimed // 0' "$body_file" 2>/dev/null || echo 0)"
                rm -f "$headers_file" "$body_file"
                return 0
              fi

              retry_after="$(awk 'BEGIN{IGNORECASE=1} /^retry-after:[[:space:]]*/ {gsub("\r", "", $2); print $2}' "$headers_file" | tail -n 1)"

              rm -f "$headers_file" "$body_file"

              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "Cron endpoint failed after ${max_attempts} attempts."
                return 1
              fi

              if [[ "$status_code" == "429" ]]; then
                sleep_seconds="${retry_after:-$((attempt * 20))}"
                echo "Rate limited (429). Sleeping ${sleep_seconds}s before retry..."
                sleep "$sleep_seconds"
                continue
              fi

              if [[ "$status_code" =~ ^5[0-9][0-9]$ || "$status_code" == "000" ]]; then
                sleep_seconds=$((attempt * 10))
                echo "Transient server/network error (${status_code}). Sleeping ${sleep_seconds}s..."
                sleep "$sleep_seconds"
                continue
              fi

              echo "Non-retryable response (${status_code}). Failing."
              return 1
            done
          }

          total_claimed=0
          for iteration in $(seq 1 "$max_drain_iterations"); do
            claimed=0
            call_endpoint
            echo "Drain pass ${iteration}: claimed ${claimed} attempt(s)."
            total_claimed=$((total_claimed + claimed))
            if [[ "$claimed" -lt 1 ]]; then
              break
            fi
          done
          echo "Dispatch drain complete. Total attempts claimed this run: ${total_claimed}."

      - name: Notify Better Stack heartbeat
        if: always()
        run: |
          set -euo pipefail
          [[ -z "${BETTERSTACK_HEARTBEAT_URL:-}" ]] && { echo "No BetterStack URL configured, skipping."; exit 0; }
          if [[ "${{ job.status }}" == "success" ]]; then
            curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$BETTERSTACK_HEARTBEAT_URL"
          else
            fail_url="${BETTERSTACK_HEARTBEAT_URL%/}/fail"
            curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$fail_url" || true
          fi
