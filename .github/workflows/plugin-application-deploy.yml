name: Deploy signed plugin application

on:
  workflow_dispatch:
    inputs:
      plugin_key:
        description: "Published application plugin key"
        required: true
        type: string
      release_tag:
        description: "Exact signed private release tag"
        required: true
        type: string
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - development
          - production

concurrency:
  group: plugin-application-${{ inputs.plugin_key }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PRIVATE_REPOSITORY: riddhimanrana/lets-assist-plugins
      PLUGIN_KEY: ${{ inputs.plugin_key }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Require the reviewed branch and scoped credentials
        shell: bash
        run: |
          set -euo pipefail
          expected_branch=development
          if [[ "${DEPLOYMENT_ENVIRONMENT}" == production ]]; then
            expected_branch=main
          fi
          if [[ "${GITHUB_REF_NAME}" != "${expected_branch}" ]]; then
            echo "${DEPLOYMENT_ENVIRONMENT} application deployments must run from ${expected_branch}." >&2
            exit 1
          fi
          if [[ ! "${PLUGIN_KEY}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] \
            || [[ ! "${RELEASE_TAG}" =~ ^${PLUGIN_KEY}/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing malformed plugin release coordinates." >&2
            exit 1
          fi
          for variable in \
            VERCEL_TOKEN \
            VERCEL_AUTOMATION_BYPASS_SECRET \
            SUPABASE_URL \
            SUPABASE_SERVICE_ROLE_KEY
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "${variable} is required in the ${DEPLOYMENT_ENVIRONMENT} GitHub environment." >&2
              exit 1
            fi
          done

      - name: Checkout the environment branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Download the immutable private release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_PLUGIN_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "PRIVATE_PLUGIN_RELEASE_TOKEN is required to read the private release." >&2
            exit 1
          fi
          mkdir -p .artifacts/plugin-application-release
          for asset in \
            release-manifest.json \
            release-manifest.sigstore.json \
            release.cdx.json \
            SHA256SUMS
          do
            gh release download "${RELEASE_TAG}" \
              --repo "${PRIVATE_REPOSITORY}" \
              --pattern "${asset}" \
              --dir .artifacts/plugin-application-release
          done
          manifest=.artifacts/plugin-application-release/release-manifest.json
          mapfile -t build_assets < <(
            jq -r '.buildArtifact.artifacts.development.name,
                   .buildArtifact.artifacts.production.name' "${manifest}"
          )
          for asset in "${build_assets[@]}"; do
            gh release download "${RELEASE_TAG}" \
              --repo "${PRIVATE_REPOSITORY}" \
              --pattern "${asset}" \
              --dir .artifacts/plugin-application-release
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify signature, registry, target, and build digest
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_dir=.artifacts/plugin-application-release
          manifest="${release_dir}/release-manifest.json"
          identity="https://github.com/${PRIVATE_REPOSITORY}/.github/workflows/plugin-release.yml@refs/tags/${RELEASE_TAG}"
          cosign verify-blob \
            --bundle "${release_dir}/release-manifest.sigstore.json" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${manifest}"
          (
            cd "${release_dir}"
            sed 's#\.artifacts/plugin-release/##' SHA256SUMS | sha256sum --check -
          )
          node scripts/plugins/verify-application-deployment.mjs \
            --manifest "${manifest}" \
            --registry lib/plugins/published-releases.json \
            --targets lib/plugins/application-deployment-targets.json \
            --build "${release_dir}/plugin-build-${DEPLOYMENT_ENVIRONMENT}.tar.gz" \
            --tag "${RELEASE_TAG}" \
            --plugin "${PLUGIN_KEY}" \
            --environment "${DEPLOYMENT_ENVIRONMENT}" \
            > "${release_dir}/deployment-summary.json"
          echo "version=$(jq -r .version "${release_dir}/deployment-summary.json")" >> "${GITHUB_OUTPUT}"
          echo "project_id=$(jq -r .buildArtifact.projectId "${release_dir}/deployment-summary.json")" >> "${GITHUB_OUTPUT}"
          echo "project_name=$(jq -r .buildArtifact.projectName "${release_dir}/deployment-summary.json")" >> "${GITHUB_OUTPUT}"
          echo "organization_id=$(jq -r .buildArtifact.organizationId "${release_dir}/deployment-summary.json")" >> "${GITHUB_OUTPUT}"
          echo "build_digest=$(jq -r .buildDigest "${release_dir}/deployment-summary.json")" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=$(jq -r .artifactName "${release_dir}/deployment-summary.json")" >> "${GITHUB_OUTPUT}"

      - name: Extract the prebuilt artifact safely
        shell: bash
        run: |
          set -euo pipefail
          archive=".artifacts/plugin-application-release/${{ steps.release.outputs.artifact_name }}"
          node scripts/plugins/validate-application-archive.mjs "${archive}"
          mkdir -p .artifacts/plugin-deploy/.vercel
          tar -xzf "${archive}" -C .artifacts/plugin-deploy
          jq -n \
            --arg projectId "${{ steps.release.outputs.project_id }}" \
            --arg orgId "${{ steps.release.outputs.organization_id }}" \
            --arg projectName "${{ steps.release.outputs.project_name }}" \
            '{projectId:$projectId,orgId:$orgId,projectName:$projectName}' \
            > .artifacts/plugin-deploy/.vercel/project.json

      - name: Deploy the exact prebuilt bytes
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          args=(
            deploy .artifacts/plugin-deploy
            --prebuilt
            --yes
            --json
            --token="${VERCEL_TOKEN}"
            --meta="pluginKey=${PLUGIN_KEY}"
            --meta="pluginVersion=${{ steps.release.outputs.version }}"
            --meta="releaseTag=${RELEASE_TAG}"
          )
          # VERCEL_TOKEN is scoped to the child project. Scoped access tokens
          # infer their project and must not be combined with --scope, which
          # makes the CLI attempt a personal-user lookup before deployment.
          if [[ "${DEPLOYMENT_ENVIRONMENT}" == production ]]; then
            args+=(--prod)
          else
            # The host's development branch and the child both run as Vercel
            # Preview deployments. The child project has no custom environments,
            # so omitting --prod and --target selects the supported Preview lane.
            :
          fi
          bunx vercel@59.3.0 "${args[@]}" > .artifacts/plugin-deployment.json
          deployment_url="$(jq -r '.deployment.url // .url' .artifacts/plugin-deployment.json)"
          deployment_id="$(jq -r '.deployment.id // .id' .artifacts/plugin-deployment.json)"
          deployment_target="$(jq -r '.deployment.target // .target' .artifacts/plugin-deployment.json)"
          test -n "${deployment_url}" && test "${deployment_url}" != null
          test -n "${deployment_id}" && test "${deployment_id}" != null
          deployment_host="${deployment_url#https://}"
          deployment_host="${deployment_host#http://}"
          deployment_host="${deployment_host%/}"
          if [[ ! "${deployment_host}" =~ ^[a-z0-9][a-z0-9.-]*\.vercel\.app$ ]] || [[ "${deployment_host}" == *".."* ]]; then
            echo "Vercel returned a non-canonical deployment URL." >&2
            exit 1
          fi
          deployment_url="https://${deployment_host}"
          target_is_valid=false
          if [[ "${DEPLOYMENT_ENVIRONMENT}" == production ]]; then
            if [[ "${deployment_target}" == production ]]; then
              target_is_valid=true
            fi
          elif [[ "${deployment_target}" == preview || "${deployment_target}" == null ]]; then
            # Vercel reports Preview as either "preview" or an omitted target.
            target_is_valid=true
          fi
          if [[ "${target_is_valid}" != true ]]; then
            echo "Vercel created a ${deployment_target} deployment for the ${DEPLOYMENT_ENVIRONMENT} release." >&2
            exit 1
          fi
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "id=${deployment_id}" >> "${GITHUB_OUTPUT}"

      - name: Record deployment observation
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg plugin "${PLUGIN_KEY}" \
            --arg version "${{ steps.release.outputs.version }}" \
            --arg environment "${DEPLOYMENT_ENVIRONMENT}" \
            --arg deployment "${{ steps.deploy.outputs.id }}" \
            --arg host "${GITHUB_SHA}" \
            --arg tag "${RELEASE_TAG}" \
            --arg digest "${{ steps.release.outputs.build_digest }}" \
            '{p_plugin_key:$plugin,p_version:$version,p_environment:$environment,p_runtime_profile:"application",p_deployment_id:$deployment,p_host_commit_sha:$host,p_runtime_contracts:{releaseTag:$tag,buildDigest:$digest}}' \
            > .artifacts/observe-deployment.json
          curl --fail-with-body --silent --show-error \
            "${SUPABASE_URL}/rest/v1/rpc/observe_plugin_deployment" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @.artifacts/observe-deployment.json \
            > /dev/null

      - name: Verify application health
        id: health
        continue-on-error: true
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_host="${DEPLOYMENT_URL#https://}"
          deployment_host="${deployment_host#http://}"
          http_status="$(curl --silent --show-error \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "https://${deployment_host}/api/plugins/${PLUGIN_KEY}/health" \
            --output .artifacts/plugin-health.json \
            --write-out '%{http_code}')"
          echo "response_reached=true" >> "${GITHUB_OUTPUT}"
          [[ "${http_status}" =~ ^2[0-9][0-9]$ ]]
          jq -e 'type == "object"' .artifacts/plugin-health.json >/dev/null
          jq -e \
            --arg plugin "${PLUGIN_KEY}" \
            --arg version "${{ steps.release.outputs.version }}" \
            '.application == $plugin and .version == $version and .runtimeProfile == "application"' \
            .artifacts/plugin-health.json >/dev/null

      - name: Record healthy deployment evidence
        if: steps.health.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          promotion_status=deployed
          if [[ "${DEPLOYMENT_ENVIRONMENT}" == production ]]; then
            promotion_status=promoted
          fi
          jq -n \
            --arg plugin "${PLUGIN_KEY}" \
            --arg environment "${DEPLOYMENT_ENVIRONMENT}" \
            --arg deployment "${{ steps.deploy.outputs.id }}" \
            --arg promotion "${promotion_status}" \
            --arg url "${{ steps.deploy.outputs.url }}" \
            --arg tag "${RELEASE_TAG}" \
            '{p_plugin_key:$plugin,p_environment:$environment,p_deployment_id:$deployment,p_health_status:"healthy",p_promotion_status:$promotion,p_health_evidence:{healthRoute:("/api/plugins/" + $plugin + "/health"),deploymentUrl:$url,releaseTag:$tag}}' \
            > .artifacts/report-deployment.json
          curl --fail-with-body --silent --show-error \
            "${SUPABASE_URL}/rest/v1/rpc/report_plugin_deployment_health" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @.artifacts/report-deployment.json \
            | jq -e '. == true' >/dev/null

      - name: Record rejected deployment evidence
        if: steps.health.outcome == 'failure' && steps.health.outputs.response_reached == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg plugin "${PLUGIN_KEY}" \
            --arg environment "${DEPLOYMENT_ENVIRONMENT}" \
            --arg deployment "${{ steps.deploy.outputs.id }}" \
            --arg url "${{ steps.deploy.outputs.url }}" \
            --arg tag "${RELEASE_TAG}" \
            '{p_plugin_key:$plugin,p_environment:$environment,p_deployment_id:$deployment,p_health_status:"unhealthy",p_promotion_status:"deployed",p_health_evidence:{healthRoute:("/api/plugins/" + $plugin + "/health"),deploymentUrl:$url,releaseTag:$tag,result:"rejected"}}' \
            > .artifacts/report-deployment.json
          curl --fail-with-body --silent --show-error \
            "${SUPABASE_URL}/rest/v1/rpc/report_plugin_deployment_health" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @.artifacts/report-deployment.json \
            | jq -e '. == true' >/dev/null
          echo "The deployed application failed its health contract." >&2
          exit 1

      - name: Fail an inaccessible health probe without misclassifying the deployment
        if: steps.health.outcome == 'failure' && steps.health.outputs.response_reached != 'true'
        shell: bash
        run: |
          echo "The deployment health endpoint could not be reached as JSON. Its recorded state remains pending." >&2
          exit 1

      - name: Publish deployment summary
        if: steps.health.outcome == 'success'
        shell: bash
        run: |
          {
            echo "## Signed plugin application deployment"
            echo "- Plugin: ${PLUGIN_KEY} ${{ steps.release.outputs.version }}"
            echo "- Environment: ${DEPLOYMENT_ENVIRONMENT}"
            echo "- Deployment: ${{ steps.deploy.outputs.id }}"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Health: verified and recorded"
          } >> "${GITHUB_STEP_SUMMARY}"
