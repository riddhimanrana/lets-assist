name: Plugin SDK release

on:
  push:
    tags:
      - "plugin-sdk/v*"

concurrency:
  group: plugin-sdk-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged SDK source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Verify the SDK tag and Development ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(jq -r .version packages/plugin-sdk/package.json)"
          expected_tag="plugin-sdk/v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Expected ${expected_tag}, received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          if [[ ! "${package_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "SDK releases require a stable semantic version." >&2
            exit 1
          fi
          git fetch --no-tags origin development
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/development
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${expected_tag}" >> "${GITHUB_OUTPUT}"

      - name: Install locked platform dependencies
        run: bun install --frozen-lockfile

      - name: Install locked SDK dependencies
        working-directory: packages/plugin-sdk
        run: bun install --frozen-lockfile

      - name: Build and test the package
        run: bun run plugin:sdk:test

      - name: Pack the versioned SDK
        shell: bash
        working-directory: packages/plugin-sdk
        run: |
          set -euo pipefail
          mkdir -p ../../.artifacts/plugin-sdk
          bun pm pack \
            --destination ../../.artifacts/plugin-sdk \
            --ignore-scripts

      - name: Generate and validate the CycloneDX SBOM
        working-directory: packages/plugin-sdk
        shell: bash
        run: |
          set -euo pipefail
          bunx @cyclonedx/cdxgen@12.8.4 \
            -t js \
            --fail-on-error \
            --no-recurse \
            --spec-version 1.6 \
            -o ../../.artifacts/plugin-sdk/plugin-sdk.cdx.json \
            .
          jq -e --arg version "${{ steps.release.outputs.version }}" '
            .bomFormat == "CycloneDX" and
            .metadata.component.purl == "pkg:npm/%40lets-assist/plugin-sdk@\($version)" and
            .metadata.component.version == $version and
            any(.components[]; .purl == "pkg:npm/ajv@8.20.0") and
            any(
              .dependencies[];
              .ref == "pkg:npm/@lets-assist/plugin-sdk@\($version)" and
              (.dependsOn | index("pkg:npm/ajv@8.20.0")) != null
            )
          ' ../../.artifacts/plugin-sdk/plugin-sdk.cdx.json

      - name: Bind package and SBOM bytes into the release manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/plugins/finalize-plugin-sdk-release.mjs \
            --source-commit "${GITHUB_SHA}" \
            --tarball ".artifacts/plugin-sdk/lets-assist-plugin-sdk-${{ steps.release.outputs.version }}.tgz" \
            --sbom .artifacts/plugin-sdk/plugin-sdk.cdx.json \
            --output .artifacts/plugin-sdk/release-manifest.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify the SDK release manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest=.artifacts/plugin-sdk/release-manifest.json
          bundle=.artifacts/plugin-sdk/release-manifest.sigstore.json
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/plugin-sdk-release.yml@${GITHUB_REF}"
          cosign sign-blob --yes --bundle "${bundle}" "${manifest}"
          cosign verify-blob \
            --bundle "${bundle}" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${manifest}"
          (
            cd .artifacts/plugin-sdk
            sha256sum \
              "lets-assist-plugin-sdk-${{ steps.release.outputs.version }}.tgz" \
              plugin-sdk.cdx.json \
              release-manifest.json \
              release-manifest.sigstore.json \
              > SHA256SUMS
          )

      - name: Retain signed SDK evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-sdk-${{ steps.release.outputs.version }}
          path: .artifacts/plugin-sdk
          if-no-files-found: error
          retention-days: 90

      - name: Publish the immutable SDK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.release.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Let's Assist plugin SDK v${{ steps.release.outputs.version }}" \
            --notes "Serializable plugin SDK v${{ steps.release.outputs.version }}. Verify release-manifest.json with the attached Sigstore bundle before consuming the package tarball." \
            .artifacts/plugin-sdk/lets-assist-plugin-sdk-${{ steps.release.outputs.version }}.tgz \
            .artifacts/plugin-sdk/plugin-sdk.cdx.json \
            .artifacts/plugin-sdk/release-manifest.json \
            .artifacts/plugin-sdk/release-manifest.sigstore.json \
            .artifacts/plugin-sdk/SHA256SUMS
