name: Change one Production CSF worker

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker to enable or disable"
        required: true
        type: choice
        options:
          - workbook_refresh
          - import_commit
          - communications
          - scheduled_post_publisher
      enabled:
        description: "Enable this worker. Uncheck to disable it independently."
        required: true
        type: boolean
        default: true
      release_sha:
        description: "Exact SHA currently served by lets-assist.com"
        required: true
        type: string
      production_confirmation:
        description: "Type enable-csf-worker:<worker>:<SHA> or disable-csf-worker:<worker>:<SHA>"
        required: true
        type: string

concurrency:
  group: production-schema-deployment
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  change-worker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Verify main contains the public release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "${RELEASE_SHA}" HEAD
      - name: Change runtime switch and verify public posture
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          WORKER: ${{ inputs.worker }}
          WORKER_ENABLED: ${{ inputs.enabled }}
          CONFIRMATION: ${{ inputs.production_confirmation }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/production/runtime-worker-transition.mjs
      - name: Retain the transition receipt even after an uncertain outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: csf-worker-transition-${{ github.run_id }}
          path: .artifacts/worker-transition.json
          if-no-files-found: warn
          retention-days: 30
