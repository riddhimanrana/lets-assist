name: PR Quality Gates

on:
  pull_request:
    branches:
      - development
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Detect DB-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            db:
              - 'supabase/**'
              - 'lib/supabase/**'
              - 'lib/plugins/**'
              - 'scripts/local-dev/**'
              - 'app/**/auth/**'
              - 'app/auth/**'

  quality:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: DV unit tests
        run: bun test ./lib/plugins/private/plugins/dv-speech-debate/services

      - name: Production build
        run: bun run build

  db-replay-validation:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.db == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.107.0

      - name: Start local Supabase
        run: bun run supabase:start

      - name: Validate DB reset replay
        run: bun run dv:dev:reset
        env:
          DV_LOCAL_TEST_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-DvTest!

      - name: Validate DV fixtures and RLS
        run: bun run dv:test:db
        env:
          DV_LOCAL_TEST_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-DvTest!

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Validate DV browser workflows
        run: bun run dv:test:e2e
        env:
          DV_LOCAL_TEST_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-DvTest!

      - name: Show Supabase status
        run: bun run supabase:status

      - name: Stop local Supabase
        if: always()
        run: bun run supabase:stop
