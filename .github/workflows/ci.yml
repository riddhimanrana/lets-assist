name: PR Quality Gates

on:
  pull_request:
    branches:
      - development
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect DB-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            db:
              - 'supabase/**'
              - '.github/workflows/**'
              - 'app/api/calendar/google/**'
              - 'app/api/cron/organization-sheet-sync/**'
              - 'app/organization/**/calendar/**'
              - 'app/organization/**/reports/sheets-actions.ts'
              - 'lib/supabase/**'
              - 'lib/auth/**'
              - 'lib/organization/calendar-sync.ts'
              - 'lib/plugins/**'
              - 'services/calendar.ts'
              - 'services/google-drive-metadata*'
              - 'services/google-sheets.ts'
              - 'scripts/check-private-submodules.mjs'
              - 'scripts/check-supabase-seed-safety*'
              - 'scripts/sync-private-submodules.mjs'
              - 'scripts/verify-*'
              - 'scripts/local-dev/**'
              - 'playwright.*.config.ts'
              - 'tests/csf/**'
              - 'package.json'
              - 'bun.lock'
              - 'app/**/auth/**'
              - 'app/auth/**'

  quality:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: Require private submodule access
        env:
          PRIVATE_SUBMODULE_SSH_KEY: ${{ secrets.PRIVATE_SUBMODULE_SSH_KEY }}
        run: |
          if [[ -z "${PRIVATE_SUBMODULE_SSH_KEY}" ]]; then
            echo "PRIVATE_SUBMODULE_SSH_KEY is required to validate the exact private plugin gitlink."
            exit 1
          fi

      - name: Checkout root
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve exact private plugin gitlink
        id: private-plugin-gitlink
        run: |
          git submodule init
          echo "sha=$(git rev-parse HEAD:lib/plugins/private)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private plugin gitlink
        uses: actions/checkout@v4
        with:
          repository: riddhimanrana/lets-assist-plugins
          ref: ${{ steps.private-plugin-gitlink.outputs.sha }}
          path: lib/plugins/private
          ssh-key: ${{ secrets.PRIVATE_SUBMODULE_SSH_KEY }}
          persist-credentials: false

      - name: Normalize private plugin remote metadata
        run: |
          git -C lib/plugins/private remote set-url origin https://github.com/riddhimanrana/lets-assist-plugins.git
          git submodule absorbgitdirs lib/plugins/private

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Validate exact private plugin gitlink
        run: bun run plugin:submodules:check:strict
        env:
          PRIVATE_SUBMODULE_ALLOW_DETACHED_GITLINK: '1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Supabase seed safety
        run: |
          bun run security:seeds
          bun run test:security:seeds

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Authentication and deployment safety tests
        run: |
          bun test \
            app/api/calendar/google/callback/connection-selection.test.ts \
            lib/auth/google-oauth-connection-store.test.ts \
            lib/auth/google-oauth-state.test.ts \
            lib/auth/google-oauth-authorization.test.ts \
            scripts/check-supabase-seed-safety.test.ts \
            scripts/local-dev/dv-local-env.test.ts \
            scripts/local-dev/supabase-cli-version.test.ts \
            scripts/verify-supabase-migration-parity.test.ts \
            scripts/verify-deployment-environment.test.ts \
            scripts/verify-production-schema-deployment.test.ts

      - name: CSF root acquisition and harness safety tests
        run: |
          bun test --preload ./scripts/local-dev/server-only-test-preload.ts \
            lib/auth/theme-script-boundary.test.ts \
            scripts/local-dev/csf-browser-harness.test.ts \
            services/google-drive-metadata.test.ts \
            services/google-sheets-report-safety.test.ts \
            services/google-sheets-source-snapshot.test.ts

      - name: Plugin unit and security tests
        run: bun run plugin:test:unit

      - name: Production build
        run: bun run build
        env:
          VERCEL_ENV: preview
          EXPECTED_NON_PRODUCTION_SUPABASE_HOST: ci-preview.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://ci-preview.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-nonfunctional-publishable-key
          SUPABASE_SECRET_KEY: ci-nonfunctional-secret-key
          SUPABASE_SERVICE_ROLE_KEY: ci-nonfunctional-service-role-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  db-replay-validation:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.db == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    env:
      CSF_ISOLATED_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CSF_ISOLATED_WORK_DIR: /tmp/lets-assist-csf-browser-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CSF_ISOLATED_BASE_PORT: '56350'
      CSF_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Require private submodule access
        env:
          PRIVATE_SUBMODULE_SSH_KEY: ${{ secrets.PRIVATE_SUBMODULE_SSH_KEY }}
        run: |
          if [[ -z "${PRIVATE_SUBMODULE_SSH_KEY}" ]]; then
            echo "PRIVATE_SUBMODULE_SSH_KEY is required to validate the exact private plugin gitlink."
            exit 1
          fi

      - name: Checkout root
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve exact private plugin gitlink
        id: private-plugin-gitlink
        run: |
          git submodule init
          echo "sha=$(git rev-parse HEAD:lib/plugins/private)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private plugin gitlink
        uses: actions/checkout@v4
        with:
          repository: riddhimanrana/lets-assist-plugins
          ref: ${{ steps.private-plugin-gitlink.outputs.sha }}
          path: lib/plugins/private
          ssh-key: ${{ secrets.PRIVATE_SUBMODULE_SSH_KEY }}
          persist-credentials: false

      - name: Normalize private plugin remote metadata
        run: |
          git -C lib/plugins/private remote set-url origin https://github.com/riddhimanrana/lets-assist-plugins.git
          git submodule absorbgitdirs lib/plugins/private

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Validate exact private plugin gitlink
        run: bun run plugin:submodules:check:strict
        env:
          PRIVATE_SUBMODULE_ALLOW_DETACHED_GITLINK: '1'

      - name: Require DVHS CSF private plugin and browser suite
        run: |
          if [[ ! -f "lib/plugins/private/plugins/dvhs-csf/plugin.tsx" ]]; then
            echo "DVHS CSF private plugin is required for database and browser validation."
            exit 1
          fi
          if ! find tests/csf -type f -name '*.spec.ts' -print -quit | grep -q .; then
            echo "DVHS CSF browser specs are required for lifecycle validation."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Validate isolated migration replay and database tests
        run: bun run csf:test:db:isolated

      - name: Start isolated Let’s Assist Supabase
        id: start-isolated
        run: |
          scripts/local-dev/start-dvhs-csf-isolated-stack.sh
          source "${CSF_ISOLATED_WORK_DIR}/lets-assist-browser.sh"

          printf '::add-mask::%s\n' \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-DvTest!" \
            "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-CsfTest!"

          for key in \
            API_URL ANON_KEY SERVICE_ROLE_KEY DB_URL \
            SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_DB_URL \
            NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SECRET_KEY \
            SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SITE_URL SITE_URL \
            NEXT_PUBLIC_VERCEL_URL CSF_ISOLATED_WORK_DIR \
            CSF_PROFILE_CLAIM_SECRET
          do
            case "${key}" in
              ANON_KEY|SERVICE_ROLE_KEY|DB_URL|SUPABASE_ANON_KEY|SUPABASE_DB_URL|\
              NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|NEXT_PUBLIC_SUPABASE_ANON_KEY|\
              SUPABASE_SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY|CSF_PROFILE_CLAIM_SECRET)
                printf '::add-mask::%s\n' "${!key}"
                ;;
            esac
            printf '%s=%s\n' "${key}" "${!key}" >> "${GITHUB_ENV}"
          done

          node scripts/local-dev/dv-local-env.mjs --health

      - name: Validate DB reset replay
        run: |
          supabase db reset --local --yes --workdir "${CSF_ISOLATED_WORK_DIR}"
          bun run supabase:seed:local-dev
          bun run dv:fixtures
        env:
          DV_LOCAL_TEST_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-DvTest!
          CSF_LOCAL_TEST_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-CsfTest!

      - name: Validate DV fixtures and RLS
        run: bun run dv:test:db
        env:
          DV_LOCAL_TEST_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-DvTest!

      - name: Validate CSF workflows and public privacy boundary
        run: bun run csf:test:workflows

      - name: Validate CSF scale and cleanup
        run: bun run csf:test:scale

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Validate DV browser workflows
        if: ${{ hashFiles('lib/plugins/private/plugins/dv-speech-debate/plugin.tsx') != '' }}
        run: bun run dv:test:e2e
        env:
          DV_LOCAL_TEST_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-DvTest!

      - name: Skip private DV browser workflows
        if: ${{ hashFiles('lib/plugins/private/plugins/dv-speech-debate/plugin.tsx') == '' }}
        run: echo "Private DV plugin submodule unavailable; skipping private DV browser workflows."

      - name: Validate CSF browser workflows
        run: bun run csf:test:e2e
        env:
          CSF_LOCAL_TEST_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-CsfTest!

      - name: Verify isolated Supabase remains healthy
        if: ${{ always() && steps.start-isolated.outcome == 'success' }}
        run: |
          source "${CSF_ISOLATED_WORK_DIR}/lets-assist-browser.sh"
          node scripts/local-dev/dv-local-env.mjs --health

      - name: Validate retained CSF browser traces
        if: ${{ always() }}
        run: |
          artifact_dir="artifacts/dvhs-csf-e2e/${CSF_E2E_RUN_ID}/playwright"
          if [[ ! -d "${artifact_dir}" ]]; then
            exit 0
          fi

          invalid_trace=0
          while IFS= read -r -d '' trace_file; do
            if ! unzip -tq "${trace_file}" >/dev/null; then
              echo "::error file=${trace_file}::Playwright trace archive is incomplete."
              invalid_trace=1
            fi
          done < <(find "${artifact_dir}" -type f -name 'trace.zip' -print0)
          exit "${invalid_trace}"

      - name: Upload CSF browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: csf-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dvhs-csf-e2e/${{ env.CSF_E2E_RUN_ID }}/playwright/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
          include-hidden-files: false

      - name: Stop isolated Let’s Assist Supabase
        if: always()
        run: |
          if [[ -n "${CSF_ISOLATED_WORK_DIR:-}" && -d "${CSF_ISOLATED_WORK_DIR}" ]]; then
            scripts/local-dev/stop-dvhs-csf-isolated-stack.sh \
              --delete-workdir \
              "${CSF_ISOLATED_WORK_DIR}"
          fi
