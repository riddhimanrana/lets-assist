name: Diagnose Production Vercel project access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 2
    steps:
      - name: Checkout reviewed diagnostics
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false

      - name: Verify Production Vercel project access and state
        env:
          EXPECTED_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          VERCEL_ROOT_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/production/verify-vercel-project.sh
