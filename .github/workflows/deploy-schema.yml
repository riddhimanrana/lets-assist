name: Deploy Production Release

on:
  workflow_dispatch:
    inputs:
      production_confirmation:
        description: "Type deploy-production:fotdmeakexgrkronxlof to deploy from main"
        required: true
        type: string
      hosted_development_sha:
        description: "Exact Development SHA with a successful hosted CSF acceptance status"
        required: true
        type: string
      external_writers_confirmation:
        description: "Type external-writers-stopped:<exact main SHA> after stopping every external writer, including Vercel Cron Jobs"
        required: true
        type: string
      application_writes_blocked_confirmation:
        description: "Type application-writes-blocked:<exact main SHA> after blocking and proving PostgREST writes before the final recovery capture"
        required: true
        type: string
      recovery_capture_sha256:
        description: "Lowercase SHA-256 of the verified canonical CAPTURE.manifest"
        required: true
        type: string
      recovery_capture_confirmation:
        description: "Type recovery-capture-verified:<exact main SHA>:<CAPTURE.manifest SHA-256> after encrypted-artifact, database-restore, and storage checks pass"
        required: true
        type: string

concurrency:
  group: production-schema-deployment
  queue: max
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  csf-release-gates:
    name: CSF release gates
    needs: production-recovery-gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  hosted-development-acceptance:
    name: Hosted Development acceptance
    needs: production-recovery-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Require accepted Development tree and status
        env:
          ACCEPTED_SHA: ${{ inputs.hosted_development_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${ACCEPTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Hosted Development SHA must be a full lowercase commit SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin "${ACCEPTED_SHA}"
          git merge-base --is-ancestor "${ACCEPTED_SHA}" HEAD
          if [[ "$(git rev-parse "${ACCEPTED_SHA}^{tree}")" != "$(git rev-parse 'HEAD^{tree}')" ]]; then
            echo "Production tree differs from the accepted Development tree." >&2
            exit 1
          fi
          status_record="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ACCEPTED_SHA}/status" \
            --jq '[.statuses[] | select(.context == "csf-hosted-development-acceptance" and .creator.login == "github-actions[bot]")] | sort_by(.created_at) | last // {}')"
          status_state="$(jq -r '.state // empty' <<<"${status_record}")"
          status_target_url="$(jq -r '.target_url // empty' <<<"${status_record}")"
          if [[ "${status_state}" != "success" ]]; then
            echo "The latest hosted Development acceptance status is not successful." >&2
            exit 1
          fi
          expected_run_prefix="https://github.com/${GITHUB_REPOSITORY}/actions/runs/"
          if [[ "${status_target_url}" != "${expected_run_prefix}"* ]]; then
            echo "Hosted Development acceptance status has no trusted workflow run." >&2
            exit 1
          fi
          run_id="${status_target_url#"${expected_run_prefix}"}"
          if [[ ! "${run_id}" =~ ^[0-9]+$ ]]; then
            echo "Hosted Development acceptance status has an invalid workflow run." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            | jq -e \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg sha "${ACCEPTED_SHA}" \
              '.path == ".github/workflows/csf-hosted-development-acceptance.yml"
               and .head_sha == $sha
               and .head_branch == "development"
               and .repository.full_name == $repository
               and .head_repository.full_name == $repository
               and .status == "completed"
               and .conclusion == "success"
              and (.event == "push" or .event == "workflow_dispatch")' \
              >/dev/null

  production-recovery-gate:
    name: Require prior Production reconciliations
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Refuse re-runs and unresolved Production recovery
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]; then
            echo "Production release re-runs are disabled. Reconcile this attempt, then start a fresh workflow dispatch." >&2
            exit 1
          fi

          source_runs="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-schema.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          while IFS=$'\t' read -r source_run_id latest_source_attempt source_sha source_status source_run_number; do
            [[ -n "${source_run_id}" ]] || continue
            if [[ "${source_run_id}" == "${GITHUB_RUN_ID}" || "${source_run_number}" -gt "${GITHUB_RUN_NUMBER}" ]]; then
              continue
            fi
            if [[ "${source_status}" != "completed" ]]; then
              echo "Earlier Production source run ${source_run_id} has not completed." >&2
              exit 1
            fi
            for ((source_run_attempt = 1; source_run_attempt <= latest_source_attempt; source_run_attempt++)); do
              source_attempt="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/attempts/${source_run_attempt}")"
              jq -e \
                --arg repository "${GITHUB_REPOSITORY}" \
                --arg run_attempt "${source_run_attempt}" \
                --arg run_id "${source_run_id}" \
                --arg sha "${source_sha}" \
                '
                  (.id | tostring) == $run_id
                  and (.run_attempt | tostring) == $run_attempt
                  and (.name == "Deploy Production Release" or .name == "Deploy Schema to Production")
                  and .path == ".github/workflows/deploy-schema.yml"
                  and .event == "workflow_dispatch"
                  and .head_branch == "main"
                  and .head_sha == $sha
                  and .head_repository.full_name == $repository
                  and .repository.full_name == $repository
                  and .status == "completed"
                ' <<<"${source_attempt}" >/dev/null
              source_conclusion="$(jq -r '.conclusion // "unknown"' <<<"${source_attempt}")"
              if [[ "${source_conclusion}" == "success" ]]; then
                continue
              fi

              recovery_context="production-release-recovery/${source_run_id}/${source_run_attempt}"
              commit_statuses="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${source_sha}/status")"
              status_record="$(jq -c \
                --arg context "${recovery_context}" \
                '[.statuses[] | select(.context == $context and .creator.login == "github-actions[bot]")] | sort_by(.created_at) | last // {}' \
                <<<"${commit_statuses}")"
              status_state="$(jq -r '.state // empty' <<<"${status_record}")"
              status_target_url="$(jq -r '.target_url // empty' <<<"${status_record}")"
              expected_run_prefix="https://github.com/${GITHUB_REPOSITORY}/actions/runs/"
              trusted_recovery=false
              if [[ "${status_state}" == "success" && "${status_target_url}" == "${expected_run_prefix}"* ]]; then
                recovery_run_id="${status_target_url#"${expected_run_prefix}"}"
                if [[ "${recovery_run_id}" =~ ^[1-9][0-9]*$ ]] && \
                  recovery_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${recovery_run_id}" 2>/dev/null)" && \
                  jq -e \
                    --arg repository "${GITHUB_REPOSITORY}" \
                    --arg run_id "${recovery_run_id}" \
                    '
                      (.id | tostring) == $run_id
                      and .name == "Reconcile Production Release"
                      and .path == ".github/workflows/production-release-recovery.yml"
                      and .event == "workflow_run"
                      and .head_branch == "main"
                      and .repository.full_name == $repository
                      and .status == "completed"
                      and .conclusion == "success"
                    ' <<<"${recovery_run}" >/dev/null; then
                  trusted_recovery=true
                fi
              fi
              if [[ "${trusted_recovery}" == "true" ]]; then
                continue
              fi

              artifact_name="production-release-recovery-${source_run_id}-${source_run_attempt}"
              artifacts="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/artifacts?name=${artifact_name}")"
              manifest_count="$(jq -r \
                --arg name "${artifact_name}" \
                '[.artifacts[]? | select(.name == $name)] | length' \
                <<<"${artifacts}")"
              if [[ "${manifest_count}" == "0" ]]; then
                source_jobs="$(gh api \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/attempts/${source_run_attempt}/jobs?per_page=100")"
                deploy_job_count="$(jq -r \
                  '[.jobs[]? | select(.name == "Deploy to Production")] | length' \
                  <<<"${source_jobs}")"
                if [[ "${deploy_job_count}" == "0" ]]; then
                  continue
                fi
                if [[ "${deploy_job_count}" != "1" ]]; then
                  echo "Production source run ${source_run_id} attempt ${source_run_attempt} has an ambiguous deployment job set." >&2
                  exit 1
                fi
                deploy_job_conclusion="$(jq -r \
                  '[.jobs[]? | select(.name == "Deploy to Production")][0].conclusion // "unknown"' \
                  <<<"${source_jobs}")"
                write_block_step_count="$(jq -r '
                  [.jobs[]? | select(.name == "Deploy to Production") | .steps[]?
                    | select(.name == "Reassert Production application write block")]
                  | length
                ' <<<"${source_jobs}")"
                if [[ "${write_block_step_count}" == "0" ]]; then
                  continue
                fi
                if [[ "${write_block_step_count}" != "1" ]]; then
                  echo "Production source run ${source_run_id} attempt ${source_run_attempt} has an ambiguous write-block step set." >&2
                  exit 1
                fi
                write_block_conclusion="$(jq -r '
                  [.jobs[]? | select(.name == "Deploy to Production") | .steps[]?
                    | select(.name == "Reassert Production application write block")][0].conclusion // "unknown"
                ' <<<"${source_jobs}")"
                if [[ "${deploy_job_conclusion}" == "skipped" || "${write_block_conclusion}" == "skipped" ]]; then
                  continue
                fi
                echo "Production source run ${source_run_id} attempt ${source_run_attempt} may have blocked writes but has no recovery manifest." >&2
                exit 1
              fi
              if [[ "${manifest_count}" != "1" ]]; then
                echo "Production source run ${source_run_id} attempt ${source_run_attempt} has an ambiguous recovery manifest." >&2
                exit 1
              fi
              echo "Production source run ${source_run_id} attempt ${source_run_attempt} has no trusted successful recovery receipt." >&2
              exit 1
            done
          done < <(jq -r '
            .[] | .workflow_runs[]?
            | [(.id | tostring), (.run_attempt | tostring), .head_sha, .status, (.run_number | tostring)]
            | @tsv
          ' <<<"${source_runs}")

  # Stage 1: Validate migrations locally before connecting to prod
  validate-migrations:
    name: Validate Migrations
    needs: production-recovery-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migration file formats
        run: |
          echo "✓ Checking migration file naming conventions..."
          for file in supabase/migrations/*.sql; do
            # Skip .gitkeep
            if [[ $(basename "$file") == ".gitkeep" ]]; then
              continue
            fi
            # Must match pattern: YYYYMMDDHHMMSS_description.sql
            if ! [[ $(basename "$file") =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "❌ Invalid migration filename: $(basename "$file")"
              echo "   Expected format: YYYYMMDDHHMMSS_description.sql"
              exit 1
            fi
          done
          echo "✓ All migration filenames are valid"

      - name: Check for duplicate timestamps
        run: |
          echo "✓ Checking for duplicate migration timestamps..."
          timestamps=$(ls -1 supabase/migrations/*.sql | grep -v '.gitkeep' | sed 's/.*\///' | cut -d_ -f1 | sort)
          if [ $(echo "$timestamps" | wc -l) -ne $(echo "$timestamps" | sort -u | wc -l) ]; then
            echo "❌ Duplicate migration timestamps detected"
            exit 1
          fi
          echo "✓ No duplicate timestamps"

      - name: Validate SQL syntax in migrations
        run: |
          echo "✓ Validating SQL syntax..."
          # Install postgresql-client for psql syntax validation
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1

          for file in supabase/migrations/*.sql; do
            if [[ $(basename "$file") == ".gitkeep" ]]; then
              continue
            fi
            # Check for common SQL errors
            if grep -q "SELECT \*\|WHERE 1=1\|-- UNSAFE" "$file"; then
              echo "⚠️  Warning: Potential issues in $(basename "$file")"
            fi
            echo "  ✓ $(basename "$file")"
          done
          echo "✓ SQL syntax check complete"

      - name: Ensure migrations have descriptions
        run: |
          echo "✓ Checking migration descriptions..."
          for file in supabase/migrations/*.sql; do
            if [[ $(basename "$file") == ".gitkeep" ]]; then
              continue
            fi
            # First line should have a comment describing the migration
            if ! head -1 "$file" | grep -q "^--"; then
              echo "⚠️  Warning: $(basename "$file") missing description comment"
            fi
          done
          echo "✓ Description check complete"

  # Stage 2: Replay, test, and audit one local Supabase instance
  test-local-reset:
    name: Test Local DB Reset
    runs-on: ubuntu-latest
    needs: validate-migrations
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Start Supabase local instance
        run: |
          echo "Starting local Supabase..."
          bun run supabase:start
          echo "Supabase started successfully"

      - name: Wait for DB readiness
        run: |
          echo "Waiting for database to be ready..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if bun run supabase:status > /dev/null 2>&1; then
              echo "✓ Database is ready"
              break
            fi
            attempt=$((attempt + 1))
            sleep 2
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Database did not become ready in time"
            exit 1
          fi

      - name: Test migration replay (reset)
        run: |
          echo "Testing migration replay with db reset..."
          if bun run supabase:reset; then
            echo "✓ Migration replay successful"
          else
            echo "❌ Migration replay failed"
            echo "Check supabase logs above for details"
            exit 1
          fi

      - name: Run pgTAP database tests
        run: |
          echo "Running the pgTAP suite against the replayed schema..."
          # The production deploy job depends on this job, so this is what makes
          # the database tests an actual production gate. Before this step they
          # ran only in ci.yml behind a paths filter, and a workflow_dispatch
          # deploy never re-ran them -- nothing verified that a green CI run
          # existed for the commit being deployed.
          #
          # These files are pure SQL and exercise tables created by public-repo
          # migrations, so they need no private submodule.
          if supabase test db --local supabase/tests/database; then
            echo "✓ pgTAP suite passed"
          else
            echo "❌ pgTAP suite failed — refusing to continue toward production"
            exit 1
          fi

      - name: Verify schema integrity
        run: |
          echo "✓ Verifying schema integrity..."
          bun run supabase:status
          echo "✓ Schema verified"

      - name: Run security advisors
        run: supabase db advisors --local --output-format json --fail-on warn

      - name: Stop local Supabase
        if: always()
        run: bun run supabase:stop || true

  # Stage 3: Deploy to production
  deploy-to-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      [
        csf-release-gates,
        hosted-development-acceptance,
        production-recovery-gate,
        validate-migrations,
        test-local-reset,
      ]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.production_confirmation == 'deploy-production:fotdmeakexgrkronxlof'
    environment: production
    steps:
      - name: Record Production job start
        id: release_clock
        timeout-minutes: 1
        run: echo "started_at=$(date +%s)" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Require exact production deployment authorization
        env:
          PRODUCTION_DEPLOY_CONFIRMATION: ${{ inputs.production_confirmation }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/verify-production-schema-deployment.mjs

      - name: Require Production recovery credentials
        timeout-minutes: 1
        env:
          PRODUCTION_READONLY_URL: ${{ secrets.PRODUCTION_READONLY_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          for variable in PRODUCTION_READONLY_URL SUPABASE_SECRET_KEY; do
            if [[ -z "${!variable:-}" ]]; then
              echo "${variable} is required before Production release preparation." >&2
              exit 1
            fi
          done

      - name: Require Production quiescence receipts
        timeout-minutes: 1
        env:
          APPLICATION_WRITES_BLOCKED_CONFIRMATION: ${{ inputs.application_writes_blocked_confirmation }}
          EXTERNAL_WRITERS_CONFIRMATION: ${{ inputs.external_writers_confirmation }}
          RECOVERY_CAPTURE_CONFIRMATION: ${{ inputs.recovery_capture_confirmation }}
          RECOVERY_CAPTURE_SHA256: ${{ inputs.recovery_capture_sha256 }}
        run: |
          set -euo pipefail
          expected_writer_receipt="external-writers-stopped:${GITHUB_SHA}"
          expected_write_block_receipt="application-writes-blocked:${GITHUB_SHA}"
          if [[ "${APPLICATION_WRITES_BLOCKED_CONFIRMATION}" != "${expected_write_block_receipt}" ]]; then
            echo "The pre-capture application write block is not bound to this release SHA." >&2
            exit 1
          fi
          if [[ "${EXTERNAL_WRITERS_CONFIRMATION}" != "${expected_writer_receipt}" ]]; then
            echo "The external-writer hold is not bound to this release SHA." >&2
            exit 1
          fi
          if ! [[ "${RECOVERY_CAPTURE_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The post-quiescence recovery manifest digest is invalid." >&2
            exit 1
          fi
          expected_capture_receipt="recovery-capture-verified:${GITHUB_SHA}:${RECOVERY_CAPTURE_SHA256}"
          if [[ "${RECOVERY_CAPTURE_CONFIRMATION}" != "${expected_capture_receipt}" ]]; then
            echo "The verified recovery capture is not bound to this release SHA and manifest digest." >&2
            exit 1
          fi

      - name: Verify Production Vercel project
        env:
          EXPECTED_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          VERCEL_ROOT_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/production/verify-vercel-project.sh

      - name: Prepare exact Production application bytes
        env:
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bunx vercel@59.3.0 pull --yes --environment=production --token="${VERCEL_TOKEN}"
          bunx vercel@59.3.0 build --prod --standalone --token="${VERCEL_TOKEN}"
          test -f .vercel/output/config.json
          mkdir -p .artifacts
          mv .vercel/output .artifacts/production-app-output
          mkdir -p .vercel/output
          cp -R scripts/production/maintenance-output/. .vercel/output/
          jq -e '.version == 3 and .crons == []' .vercel/output/config.json >/dev/null

      - name: Link to production database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "Linking to production Supabase project..."
          supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Verify linked production project ref
        env:
          PRODUCTION_DEPLOY_CONFIRMATION: ${{ inputs.production_confirmation }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ ! -f supabase/.temp/project-ref ]]; then
            echo "Supabase link did not create supabase/.temp/project-ref." >&2
            exit 1
          fi
          export LINKED_SUPABASE_PROJECT_REF="$(tr -d '[:space:]' < supabase/.temp/project-ref)"
          node scripts/verify-production-schema-deployment.mjs

      - name: Run read-only Production cutover preflight
        env:
          EXPECTED_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          PRODUCTION_READONLY_URL: ${{ secrets.PRODUCTION_READONLY_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const expectedRef = process.env.EXPECTED_SUPABASE_PROJECT_REF ?? "";
          const rawDatabaseUrl = process.env.PRODUCTION_READONLY_URL ?? "";
          if (!/^[a-z]{20}$/.test(expectedRef) || rawDatabaseUrl.length === 0) {
            console.error("The Production read-only database binding is invalid.");
            process.exit(1);
          }
          let databaseUrl;
          try {
            databaseUrl = new URL(rawDatabaseUrl);
          } catch {
            console.error("The Production read-only database binding is invalid.");
            process.exit(1);
          }
          const hostname = databaseUrl.hostname.toLowerCase();
          const directHostMatches = hostname === `db.${expectedRef}.supabase.co`;
          const poolerHostMatches = hostname.endsWith(".pooler.supabase.com");
          let databaseUsername;
          try {
            databaseUsername = decodeURIComponent(databaseUrl.username);
          } catch {
            console.error("The Production read-only database binding is invalid.");
            process.exit(1);
          }
          const poolerUserMatches =
            databaseUsername === `postgres.${expectedRef}`;
          const protocolMatches =
            databaseUrl.protocol === "postgres:" ||
            databaseUrl.protocol === "postgresql:";
          if (
            !protocolMatches ||
            (!directHostMatches && !(poolerHostMatches && poolerUserMatches))
          ) {
            console.error("The Production read-only database binding is invalid.");
            process.exit(1);
          }
          NODE
          preflight_log="$(mktemp)"
          trap 'rm -f "${preflight_log}"' EXIT
          if ! timeout 300s psql -X "${PRODUCTION_READONLY_URL}" \
            -v ON_ERROR_STOP=1 \
            -f scripts/production-cutover-preflight.sql \
            >"${preflight_log}" 2>&1; then
            echo "Production cutover preflight failed. Raw output was suppressed." >&2
            exit 1
          fi
          echo "Production cutover preflight passed."

      - name: Show pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Migrations to be applied:"
          supabase db push --linked --dry-run

      - name: Stage static Production maintenance page
        id: deploy-maintenance
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bunx vercel@59.3.0 deploy \
            --prebuilt \
            --prod \
            --skip-domain \
            --yes \
            --json \
            --token="${VERCEL_TOKEN}" \
            --meta="productionMaintenanceForSha=${GITHUB_SHA}" \
            > .artifacts/production-maintenance-deployment.json
          deployment_id="$(jq -er '.deployment.id // .id' .artifacts/production-maintenance-deployment.json)"
          deployment_url="$(jq -er '.deployment.url // .url' .artifacts/production-maintenance-deployment.json)"
          deployment_target="$(jq -er '.deployment.target // .target' .artifacts/production-maintenance-deployment.json)"
          if [[ ! "${deployment_id}" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
            echo "Vercel returned a malformed maintenance deployment id." >&2
            exit 1
          fi
          deployment_host="${deployment_url#https://}"
          deployment_host="${deployment_host#http://}"
          deployment_host="${deployment_host%/}"
          if [[ ! "${deployment_host}" =~ ^[a-z0-9][a-z0-9.-]*\.vercel\.app$ ]] || [[ "${deployment_host}" == *".."* ]]; then
            echo "Vercel returned a non-canonical maintenance deployment URL." >&2
            exit 1
          fi
          if [[ "${deployment_target}" != "production" ]]; then
            echo "Vercel staged the maintenance page outside Production." >&2
            exit 1
          fi
          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"
          echo "deployment_url=https://${deployment_host}" >> "${GITHUB_OUTPUT}"

      - name: Verify staged maintenance page
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-maintenance.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          maintenance_marker="$(bunx vercel@59.3.0 curl '/maintenance-health.txt' \
            --deployment="${DEPLOYMENT_URL}" \
            --protection-bypass="${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            --yes \
            --token="${VERCEL_TOKEN}" \
            -- \
            --connect-timeout 10 \
            --max-time 30)"
          test "${maintenance_marker}" = "lets-assist-production-maintenance-v1"

      - name: Stage exact Production application without moving domains
        id: deploy-application
        timeout-minutes: 4
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          mv .artifacts/production-app-output .vercel/output
          bunx vercel@59.3.0 deploy \
            --prebuilt \
            --prod \
            --skip-domain \
            --yes \
            --json \
            --token="${VERCEL_TOKEN}" \
            --meta="productionReleaseSha=${GITHUB_SHA}" \
            > .artifacts/production-deployment.json
          deployment_id="$(jq -er '.deployment.id // .id' .artifacts/production-deployment.json)"
          deployment_url="$(jq -er '.deployment.url // .url' .artifacts/production-deployment.json)"
          deployment_target="$(jq -er '.deployment.target // .target' .artifacts/production-deployment.json)"
          if [[ ! "${deployment_id}" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
            echo "Vercel returned a malformed Production deployment id." >&2
            exit 1
          fi
          deployment_host="${deployment_url#https://}"
          deployment_host="${deployment_host#http://}"
          deployment_host="${deployment_host%/}"
          if [[ ! "${deployment_host}" =~ ^[a-z0-9][a-z0-9.-]*\.vercel\.app$ ]] || [[ "${deployment_host}" == *".."* ]]; then
            echo "Vercel returned a non-canonical Production deployment URL." >&2
            exit 1
          fi
          if [[ "${deployment_target}" != "production" ]]; then
            echo "Vercel staged the application outside Production." >&2
            exit 1
          fi
          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"
          echo "deployment_url=https://${deployment_host}" >> "${GITHUB_OUTPUT}"

      - name: Prove staged Production application identity
        timeout-minutes: 2
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-application.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          status_payload="$(bunx vercel@59.3.0 curl '/api/status?deep=0' \
            --deployment="${DEPLOYMENT_URL}" \
            --protection-bypass="${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            --yes \
            --token="${VERCEL_TOKEN}" \
            -- \
            --connect-timeout 10 \
            --max-time 30)"
          jq -e --arg sha "${GITHUB_SHA}" '
            .version == $sha
            and .environment == "production"
            and .deep == false
            and ([.checks[] | select(
              .name == "workers"
              and .details.csfWorkbookRefresh == false
              and .details.csfImportCommit == false
              and .details.csfCommunications == false
              and .details.csfScheduledPostPublisher == false
            )] | length) == 1
          ' <<<"${status_payload}" >/dev/null

      - name: Write Production recovery manifest
        timeout-minutes: 1
        env:
          APPLICATION_WRITES_BLOCKED_CONFIRMATION: ${{ inputs.application_writes_blocked_confirmation }}
          APPLICATION_DEPLOYMENT_ID: ${{ steps.deploy-application.outputs.deployment_id }}
          APPLICATION_DEPLOYMENT_URL: ${{ steps.deploy-application.outputs.deployment_url }}
          EXTERNAL_WRITERS_CONFIRMATION: ${{ inputs.external_writers_confirmation }}
          MAINTENANCE_DEPLOYMENT_ID: ${{ steps.deploy-maintenance.outputs.deployment_id }}
          MAINTENANCE_DEPLOYMENT_URL: ${{ steps.deploy-maintenance.outputs.deployment_url }}
          RECOVERY_CAPTURE_CONFIRMATION: ${{ inputs.recovery_capture_confirmation }}
          RECOVERY_CAPTURE_SHA256: ${{ inputs.recovery_capture_sha256 }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          VERCEL_ROOT_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: |
          set -euo pipefail
          jq -n \
            --arg application_writes_blocked_confirmation "${APPLICATION_WRITES_BLOCKED_CONFIRMATION}" \
            --arg application_deployment_id "${APPLICATION_DEPLOYMENT_ID}" \
            --arg application_deployment_url "${APPLICATION_DEPLOYMENT_URL}" \
            --arg external_writers_confirmation "${EXTERNAL_WRITERS_CONFIRMATION}" \
            --arg maintenance_deployment_id "${MAINTENANCE_DEPLOYMENT_ID}" \
            --arg maintenance_deployment_url "${MAINTENANCE_DEPLOYMENT_URL}" \
            --arg recovery_capture_confirmation "${RECOVERY_CAPTURE_CONFIRMATION}" \
            --arg recovery_capture_sha256 "${RECOVERY_CAPTURE_SHA256}" \
            --arg ref "${GITHUB_REF}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg sha "${GITHUB_SHA}" \
            --arg supabase_project_id "${SUPABASE_PROJECT_ID}" \
            --arg vercel_project_id "${VERCEL_ROOT_PROJECT_ID}" \
            --arg vercel_team_id "${VERCEL_TEAM_ID}" \
            '{
              version: 1,
              applicationWritesBlockedConfirmation: $application_writes_blocked_confirmation,
              applicationDeploymentId: $application_deployment_id,
              applicationDeploymentUrl: $application_deployment_url,
              externalWritersConfirmation: $external_writers_confirmation,
              maintenanceDeploymentId: $maintenance_deployment_id,
              maintenanceDeploymentUrl: $maintenance_deployment_url,
              ref: $ref,
              repository: $repository,
              recoveryCaptureConfirmation: $recovery_capture_confirmation,
              recoveryCaptureSha256: $recovery_capture_sha256,
              runAttempt: $run_attempt,
              runId: $run_id,
              sha: $sha,
              supabaseProjectId: $supabase_project_id,
              vercelProjectId: $vercel_project_id,
              vercelTeamId: $vercel_team_id
            }' > .artifacts/production-release-recovery.json
          jq -e '
              .version == 1
              and (.applicationDeploymentId | test("^dpl_[A-Za-z0-9]+$"))
              and (.maintenanceDeploymentId | test("^dpl_[A-Za-z0-9]+$"))
              and (.sha | test("^[0-9a-f]{40}$"))
              and .applicationWritesBlockedConfirmation == ("application-writes-blocked:" + .sha)
              and .externalWritersConfirmation == ("external-writers-stopped:" + .sha)
              and (.recoveryCaptureSha256 | test("^[0-9a-f]{64}$"))
              and .recoveryCaptureConfirmation == ("recovery-capture-verified:" + .sha + ":" + .recoveryCaptureSha256)
            ' .artifacts/production-release-recovery.json >/dev/null

      - name: Retain Production recovery manifest
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-release-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/production-release-recovery.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify Production quiescence receipt and database posture
        timeout-minutes: 2
        env:
          PRODUCTION_READONLY_URL: ${{ secrets.PRODUCTION_READONLY_URL }}
        run: |
          set -euo pipefail
          quiescence_log="$(mktemp)"
          trap 'rm -f "${quiescence_log}"' EXIT
          if ! timeout 30s psql -X "${PRODUCTION_READONLY_URL}" \
            -v ON_ERROR_STOP=1 \
            -f scripts/production/verify-cutover-quiescence.sql \
            >"${quiescence_log}" 2>&1; then
            echo "Production quiescence verification failed. Raw output was suppressed." >&2
            exit 1
          fi
          echo "Production quiescence verified."

      - name: Arm Production maintenance recovery
        id: write_block_recovery
        timeout-minutes: 1
        env:
          PRODUCTION_JOB_STARTED_AT: ${{ steps.release_clock.outputs.started_at }}
        run: |
          set -euo pipefail
          if [[ ! "${PRODUCTION_JOB_STARTED_AT}" =~ ^[0-9]+$ ]]; then
            echo "The Production job start time is invalid; refusing to arm maintenance recovery." >&2
            exit 1
          fi
          elapsed_seconds=$(( $(date +%s) - PRODUCTION_JOB_STARTED_AT ))
          if (( elapsed_seconds > 2100 )); then
            echo "More than 35 minutes elapsed before the write-block window; refusing to arm maintenance recovery." >&2
            exit 1
          fi
          echo "armed=true" >> "${GITHUB_OUTPUT}"

      - name: Reassert Production application write block
        id: enable_write_block
        timeout-minutes: 2
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/production/set-application-write-block.sh enable

      - name: Prove a fresh Production application write is blocked
        timeout-minutes: 2
        env:
          EXPECTED_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: bash scripts/production/verify-postgrest-write-block.sh

      - name: Promote maintenance page to Production
        timeout-minutes: 11
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-maintenance.outputs.deployment_url }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bunx vercel@59.3.0 promote "${DEPLOYMENT_URL}" \
            --yes \
            --timeout=10m \
            --token="${VERCEL_TOKEN}"

      - name: Verify Production maintenance alias
        timeout-minutes: 4
        env:
          PRODUCTION_DEPLOYMENT_ID: ${{ steps.deploy-maintenance.outputs.deployment_id }}
          VERCEL_ROOT_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/production/verify-vercel-alias.sh

      - name: Push schema to production
        timeout-minutes: 15
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Pushing migrations to production..."
          echo "⚠️  This will modify the production database - ensure all checks passed above"
          echo ""
          supabase db push --linked --dry-run
          echo "✓ Dry-run successful, proceeding with deployment..."

          supabase db push --linked --yes 2>&1 | tee deploy.log

          echo ""
          echo "✓ Deployment to production completed successfully"

      - name: Verify production schema deployment
        timeout-minutes: 4
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Verifying production migration parity..."
          supabase migration list --linked --output-format json > migration-list.json
          node scripts/verify-supabase-migration-parity.mjs migration-list.json
          echo "✓ Production migration history matches the repository"

      - name: Verify CSF target schema compatibility
        timeout-minutes: 2
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if ! timeout 60s supabase db query --linked \
            --file scripts/production/verify-csf-target-schema.sql \
            >/dev/null 2>&1; then
            echo "The Production CSF schema does not match this release." >&2
            exit 1
          fi
          echo "Production CSF schema compatibility verified."

      - name: Run full post-push Production cutover preflight
        timeout-minutes: 6
        env:
          PRODUCTION_READONLY_URL: ${{ secrets.PRODUCTION_READONLY_URL }}
        run: |
          set -euo pipefail
          post_push_preflight_log="$(mktemp)"
          trap 'rm -f "${post_push_preflight_log}"' EXIT
          if ! timeout 300s psql -X "${PRODUCTION_READONLY_URL}" \
            -v ON_ERROR_STOP=1 \
            -f scripts/production-cutover-preflight.sql \
            >"${post_push_preflight_log}" 2>&1; then
            echo "Post-push Production cutover preflight failed. Raw output was suppressed." >&2
            exit 1
          fi
          echo "Post-push Production cutover preflight passed."

      - name: Smoke the staged Production application
        timeout-minutes: 2
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-application.outputs.deployment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          status_payload="$(bunx vercel@59.3.0 curl '/api/status?deep=1' \
            --deployment="${DEPLOYMENT_URL}" \
            --protection-bypass="${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            --yes \
            --token="${VERCEL_TOKEN}" \
            -- \
            --connect-timeout 10 \
            --max-time 30)"
          jq -e --arg sha "${GITHUB_SHA}" '
            .version == $sha
            and .deep == true
            and ([.checks[] | select(.name == "environment" and .critical == true and .state == "pass")] | length) == 1
            and ([.checks[] | select(.name == "database" and .critical == true and .state == "pass")] | length) == 1
            and ([.checks[] | select(.name == "tables-deep" and .state == "pass")] | length) == 1
            and ([.checks[] | select(
              .name == "workers"
              and .details.csfWorkbookRefresh == false
              and .details.csfImportCommit == false
              and .details.csfCommunications == false
              and .details.csfScheduledPostPublisher == false
            )] | length) == 1
          ' <<<"${status_payload}" >/dev/null

      - name: Promote the staged application to Production
        id: promote_application
        timeout-minutes: 11
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-application.outputs.deployment_url }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          bunx vercel@59.3.0 promote "${DEPLOYMENT_URL}" \
            --yes \
            --timeout=10m \
            --token="${VERCEL_TOKEN}"
          promote_exit="$?"
          set -e
          if [[ "${promote_exit}" -ne 0 ]]; then
            echo "Vercel promote returned ${promote_exit}; the exact alias postcondition will determine the release result." >&2
          fi

      - name: Verify application promotion reached a terminal state
        timeout-minutes: 2
        env:
          EXPECTED_ALIAS_OPERATION: promote
          EXPECTED_ALIAS_OPERATION_DEPLOYMENT_ID: ${{ steps.deploy-application.outputs.deployment_id }}
          VERCEL_ALIAS_OPERATION_TIMEOUT_SECONDS: "50"
          VERCEL_ROOT_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: timeout 60s bash scripts/production/verify-vercel-alias-operation.sh

      - name: Verify Production alias promotion
        timeout-minutes: 4
        env:
          PRODUCTION_DEPLOYMENT_ID: ${{ steps.deploy-application.outputs.deployment_id }}
          VERCEL_ROOT_PROJECT_ID: ${{ vars.VERCEL_ROOT_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/production/verify-vercel-alias.sh

      - name: Verify public Production release postcondition
        timeout-minutes: 2
        env:
          EXPECTED_CSF_WORKER_STAGE: disabled
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header 'Cache-Control: no-cache' \
            "https://lets-assist.com/api/status?deep=0&release_gate=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            | node scripts/production/verify-csf-worker-posture.mjs

      - name: Open Production application writes
        id: disable_write_block
        timeout-minutes: 2
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/production/set-application-write-block.sh disable

      - name: Retain Production write block after incomplete release
        if: ${{ always() && steps.write_block_recovery.outputs.armed == 'true' && steps.enable_write_block.outcome != 'skipped' && steps.disable_write_block.outcome != 'success' }}
        timeout-minutes: 4
        env:
          EXPECTED_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -uo pipefail
          postcondition_failures=0
          if ! timeout 45s bash scripts/production/set-application-write-block.sh enable; then
            echo "Write-block reassertion returned an error; checking the postcondition." >&2
            postcondition_failures=$((postcondition_failures + 1))
          fi

          if ! (
            set -euo pipefail
            timeout 25s bash scripts/production/verify-postgrest-write-block.sh
          ); then
            echo "The Production application write block is unproven." >&2
            postcondition_failures=$((postcondition_failures + 1))
          fi
          if [[ "${postcondition_failures}" -ne 0 ]]; then
            exit 1
          fi

      - name: Post deployment summary
        if: success()
        timeout-minutes: 1
        run: |
          echo "## Production release succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The accepted tree passed the release gates, schema parity, staged health check, and Production alias verification." >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment failure
        if: failure()
        timeout-minutes: 1
        run: |
          echo "## Production release failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs and production migration ledger before retrying." >> $GITHUB_STEP_SUMMARY
          echo "If the failure occurred during or after schema push, production may already contain some or all pending migrations." >> $GITHUB_STEP_SUMMARY
