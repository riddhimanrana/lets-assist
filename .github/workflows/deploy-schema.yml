name: Deploy Schema to Production

on:
  workflow_dispatch:
    inputs:
      production_confirmation:
        description: "Type deploy-production:fotdmeakexgrkronxlof to deploy from main"
        required: true
        type: string
      hosted_development_sha:
        description: "Exact Development SHA with a successful hosted CSF acceptance status"
        required: true
        type: string

concurrency:
  group: production-schema-deployment
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  csf-release-gates:
    name: CSF release gates
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  hosted-development-acceptance:
    name: Hosted Development acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require accepted Development tree and status
        env:
          ACCEPTED_SHA: ${{ inputs.hosted_development_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${ACCEPTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Hosted Development SHA must be a full lowercase commit SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin "${ACCEPTED_SHA}"
          git merge-base --is-ancestor "${ACCEPTED_SHA}" HEAD
          if [[ "$(git rev-parse "${ACCEPTED_SHA}^{tree}")" != "$(git rev-parse 'HEAD^{tree}')" ]]; then
            echo "Production tree differs from the accepted Development tree." >&2
            exit 1
          fi
          status_target_url="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ACCEPTED_SHA}/status" \
            --jq '[.statuses[] | select(.context == "csf-hosted-development-acceptance" and .state == "success" and .creator.login == "github-actions[bot]")] | sort_by(.created_at) | last | .target_url // empty')"
          expected_run_prefix="https://github.com/${GITHUB_REPOSITORY}/actions/runs/"
          if [[ "${status_target_url}" != "${expected_run_prefix}"* ]]; then
            echo "Hosted Development acceptance status has no trusted workflow run." >&2
            exit 1
          fi
          run_id="${status_target_url#"${expected_run_prefix}"}"
          if [[ ! "${run_id}" =~ ^[0-9]+$ ]]; then
            echo "Hosted Development acceptance status has an invalid workflow run." >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            | jq -e \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg sha "${ACCEPTED_SHA}" \
              '.path == ".github/workflows/csf-hosted-development-acceptance.yml"
               and .head_sha == $sha
               and .head_branch == "development"
               and .repository.full_name == $repository
               and .head_repository.full_name == $repository
               and .status == "completed"
               and .conclusion == "success"
               and (.event == "push" or .event == "workflow_dispatch")' \
              >/dev/null

  # Stage 1: Validate migrations locally before connecting to prod
  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migration file formats
        run: |
          echo "✓ Checking migration file naming conventions..."
          for file in supabase/migrations/*.sql; do
            # Skip .gitkeep
            if [[ $(basename "$file") == ".gitkeep" ]]; then
              continue
            fi
            # Must match pattern: YYYYMMDDHHMMSS_description.sql
            if ! [[ $(basename "$file") =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "❌ Invalid migration filename: $(basename "$file")"
              echo "   Expected format: YYYYMMDDHHMMSS_description.sql"
              exit 1
            fi
          done
          echo "✓ All migration filenames are valid"

      - name: Check for duplicate timestamps
        run: |
          echo "✓ Checking for duplicate migration timestamps..."
          timestamps=$(ls -1 supabase/migrations/*.sql | grep -v '.gitkeep' | sed 's/.*\///' | cut -d_ -f1 | sort)
          if [ $(echo "$timestamps" | wc -l) -ne $(echo "$timestamps" | sort -u | wc -l) ]; then
            echo "❌ Duplicate migration timestamps detected"
            exit 1
          fi
          echo "✓ No duplicate timestamps"

      - name: Validate SQL syntax in migrations
        run: |
          echo "✓ Validating SQL syntax..."
          # Install postgresql-client for psql syntax validation
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1

          for file in supabase/migrations/*.sql; do
            if [[ $(basename "$file") == ".gitkeep" ]]; then
              continue
            fi
            # Check for common SQL errors
            if grep -q "SELECT \*\|WHERE 1=1\|-- UNSAFE" "$file"; then
              echo "⚠️  Warning: Potential issues in $(basename "$file")"
            fi
            echo "  ✓ $(basename "$file")"
          done
          echo "✓ SQL syntax check complete"

      - name: Ensure migrations have descriptions
        run: |
          echo "✓ Checking migration descriptions..."
          for file in supabase/migrations/*.sql; do
            if [[ $(basename "$file") == ".gitkeep" ]]; then
              continue
            fi
            # First line should have a comment describing the migration
            if ! head -1 "$file" | grep -q "^--"; then
              echo "⚠️  Warning: $(basename "$file") missing description comment"
            fi
          done
          echo "✓ Description check complete"

  # Stage 2: Replay, test, and audit one local Supabase instance
  test-local-reset:
    name: Test Local DB Reset
    runs-on: ubuntu-latest
    needs: validate-migrations
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Start Supabase local instance
        run: |
          echo "Starting local Supabase..."
          bun run supabase:start
          echo "Supabase started successfully"

      - name: Wait for DB readiness
        run: |
          echo "Waiting for database to be ready..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if bun run supabase:status > /dev/null 2>&1; then
              echo "✓ Database is ready"
              break
            fi
            attempt=$((attempt + 1))
            sleep 2
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Database did not become ready in time"
            exit 1
          fi

      - name: Test migration replay (reset)
        run: |
          echo "Testing migration replay with db reset..."
          if bun run supabase:reset; then
            echo "✓ Migration replay successful"
          else
            echo "❌ Migration replay failed"
            echo "Check supabase logs above for details"
            exit 1
          fi

      - name: Run pgTAP database tests
        run: |
          echo "Running the pgTAP suite against the replayed schema..."
          # The production deploy job depends on this job, so this is what makes
          # the database tests an actual production gate. Before this step they
          # ran only in ci.yml behind a paths filter, and a workflow_dispatch
          # deploy never re-ran them -- nothing verified that a green CI run
          # existed for the commit being deployed.
          #
          # These files are pure SQL and exercise tables created by public-repo
          # migrations, so they need no private submodule.
          if supabase test db --local supabase/tests/database; then
            echo "✓ pgTAP suite passed"
          else
            echo "❌ pgTAP suite failed — refusing to continue toward production"
            exit 1
          fi

      - name: Verify schema integrity
        run: |
          echo "✓ Verifying schema integrity..."
          bun run supabase:status
          echo "✓ Schema verified"

      - name: Run security advisors
        run: supabase db advisors --local --output-format json --fail-on warn

      - name: Stop local Supabase
        if: always()
        run: bun run supabase:stop || true

  # Stage 3: Deploy to production
  deploy-to-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs:
      [
        csf-release-gates,
        hosted-development-acceptance,
        validate-migrations,
        test-local-reset,
      ]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.production_confirmation == 'deploy-production:fotdmeakexgrkronxlof'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Require exact production deployment authorization
        env:
          PRODUCTION_DEPLOY_CONFIRMATION: ${{ inputs.production_confirmation }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/verify-production-schema-deployment.mjs

      - name: Link to production database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "Linking to production Supabase project..."
          supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Verify linked production project ref
        env:
          PRODUCTION_DEPLOY_CONFIRMATION: ${{ inputs.production_confirmation }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ ! -f supabase/.temp/project-ref ]]; then
            echo "Supabase link did not create supabase/.temp/project-ref." >&2
            exit 1
          fi
          export LINKED_SUPABASE_PROJECT_REF="$(tr -d '[:space:]' < supabase/.temp/project-ref)"
          node scripts/verify-production-schema-deployment.mjs

      - name: Show pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Migrations to be applied:"
          supabase db push --linked --dry-run

      - name: Push schema to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Pushing migrations to production..."
          echo "⚠️  This will modify the production database - ensure all checks passed above"
          echo ""
          supabase db push --linked --dry-run
          echo "✓ Dry-run successful, proceeding with deployment..."

          supabase db push --linked --yes 2>&1 | tee deploy.log

          echo ""
          echo "✓ Deployment to production completed successfully"

      - name: Verify production deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Verifying production migration parity..."
          supabase migration list --linked --output-format json > migration-list.json
          node scripts/verify-supabase-migration-parity.mjs migration-list.json
          echo "✓ Production migration history matches the repository"

      - name: Post deployment summary
        if: success()
        run: |
          echo "## ✓ Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All migrations have been safely applied to production:" >> $GITHUB_STEP_SUMMARY
          echo "- Schema validation: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Local migration replay: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Security & performance checks: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Production deployment: ✓" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "## ❌ Production Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs and production migration ledger before retrying." >> $GITHUB_STEP_SUMMARY
          echo "If the failure occurred during or after schema push, production may already contain some or all pending migrations." >> $GITHUB_STEP_SUMMARY
